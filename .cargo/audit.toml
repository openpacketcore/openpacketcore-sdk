# cargo-audit configuration for the `Rust advisory scan` CI job.

[advisories]
# Marvin Attack timing sidechannel in the `rsa` crate's private-key
# operations (no fixed release upstream). Default builds of opc-proto-ikev2
# use the crate for RSA signature *verification* only (public-key
# operations, outside the advisory's scope); RSA private-key signing is
# compiled only behind the opt-in `rsa-signing` feature and ECDSA responder
# certificates are the recommended deployment. Mirror of the ignore entry
# in deny.toml — keep the two in sync and drop both once `rsa` ships the
# constant-time rewrite.
#
# Out-of-bounds reads when deserializing untrusted `rkyv` archives that
# contain Rc/Arc. rkyv 0.7.46 appears in Cargo.lock only as the optional,
# never-enabled rkyv integration of rust_decimal, reached through the pinned
# openraft fork's byte-unit dependency; byte-unit consumes rust_decimal with
# default features off and nothing enables rust_decimal's rkyv feature, so
# rkyv is never compiled into or linked by any workspace artifact under any
# feature set (`cargo tree -i rkyv --all-features` prints nothing). There is
# no patched 0.7.x release (the advisory's fix is >= 0.8.17, which
# rust_decimal 1.42.1's `^0.7.46` requirement cannot reach), and rust_decimal
# and byte-unit are both already at their newest releases. Mirror of the
# ignore entry in deny.toml — keep the two in sync and drop both once
# rust_decimal migrates its rkyv integration to a patched rkyv (or byte-unit
# or the pinned openraft no longer pulls rust_decimal).
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0235"]
