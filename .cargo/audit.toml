# cargo-audit configuration for the `Rust advisory scan` CI job.

[advisories]
# Marvin Attack timing sidechannel in the `rsa` crate's private-key
# operations (no fixed release upstream). Default builds of opc-proto-ikev2
# use the crate for RSA signature *verification* only (public-key
# operations, outside the advisory's scope); RSA private-key signing is
# compiled only behind the opt-in `rsa-signing` feature and ECDSA responder
# certificates are the recommended deployment. Mirror of the ignore entry
# in deny.toml — keep the two in sync and drop both once `rsa` ships the
# constant-time rewrite.
#
# Tokio 1.53.1 AsyncFd constructors violate I/O safety (RUSTSEC-2026-0386). The
# three AsyncFd::new uses (opc-sctp, opc-session-store, opc-egress-fence) own
# their descriptors exclusively and never replace/close them while registered;
# migrating to AsyncFd::register needs `unsafe` outside the ADR 0017 sys-crate
# allow-list, tracked as follow-up. Mirror of deny.toml — keep in sync.
#
# Timing variability in crypto-bigint operations intended to be constant-time.
# The 0.7.x line is bumped to 0.7.6 (the advisory's fix). A crypto-bigint 0.5.5
# copy remains only in the audited vendored DTLS fork (dimpl 0.7.2 -> p256/p384
# 0.13 -> elliptic-curve 0.13.8) consumed by opc-diameter-transport; no 0.5.x
# fix exists and the fork's rust-crypto backend has not migrated. Explicit,
# scoped risk acceptance: exploiting it needs a local timing oracle against the
# DTLS certificate ECDSA path; upgrading the fork's RustCrypto stack is tracked
# as follow-up. Mirror of deny.toml — keep the two in sync.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0235", "RUSTSEC-2026-0386", "RUSTSEC-2026-0387"]
