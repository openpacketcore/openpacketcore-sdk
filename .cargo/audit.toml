# cargo-audit configuration for the `Rust advisory scan` CI job.

[advisories]
# Marvin Attack timing sidechannel in the `rsa` crate's private-key
# operations (no fixed release upstream). Default builds of opc-proto-ikev2
# use the crate for RSA signature *verification* only (public-key
# operations, outside the advisory's scope); RSA private-key signing is
# compiled only behind the opt-in `rsa-signing` feature and ECDSA responder
# certificates are the recommended deployment. Mirror of the ignore entry
# in deny.toml — keep the two in sync and drop both once `rsa` ships the
# constant-time rewrite.
#
# OOB reads deserializing untrusted rkyv archives containing Rc/Arc
# (RUSTSEC-2026-0235). rkyv 0.7.46 is only a lockfile entry: it is the optional,
# never-enabled rkyv integration of rust_decimal, reached through the pinned
# openraft fork's byte-unit dependency and never compiled into a workspace
# artifact. No patched 0.7.x release exists. Remove once rust_decimal's rkyv
# integration moves to a patched rkyv or the pinned openraft drops it.
# Mirror of deny.toml — keep in sync.
#
# Tokio 1.53.1 AsyncFd constructors violate I/O safety (RUSTSEC-2026-0386).
# The five production constructor sites in opc-sctp, opc-session-store and
# opc-egress-fence own their descriptors exclusively and never replace/close
# them while registered. The GTP-U readiness test borrows its descriptor and
# retains the owning readiness handle for the entire AsyncFd registration;
# migrating to AsyncFd::register needs `unsafe` outside the ADR 0017 sys-crate
# allow-list, tracked as follow-up. Mirror of deny.toml — keep in sync.
#
# Timing variability in crypto-bigint operations intended to be constant-time.
# The 0.7.x line uses non-yanked 0.7.10, retaining the fix introduced in 0.7.6.
# A crypto-bigint 0.5.5 copy remains only in the audited vendored DTLS fork
# (dimpl 0.7.2 -> p256/p384 0.13 -> elliptic-curve 0.13.8) consumed by
# opc-diameter-transport; no 0.5.x fix exists and the fork's rust-crypto backend
# has not migrated. It serves DTLS key agreement and certificate signing.
# Observable timing leakage depends on the algorithm, compiler and target;
# remote exploitability has not been ruled out. Upgrading the fork's RustCrypto
# stack is tracked as follow-up. The security workflow checks every tracked
# lockfile and confines this ID-wide ignore to that exact version and path.
# Mirror of deny.toml — keep the two in sync.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0235", "RUSTSEC-2026-0386", "RUSTSEC-2026-0387"]
