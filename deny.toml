[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin Attack timing sidechannel in the `rsa` crate's private-key
    # operations. No fixed release exists upstream. Default builds of
    # opc-proto-ikev2 use the crate for RSA signature *verification* only
    # (public-key operations, outside the advisory's scope); RSA private-key
    # signing is compiled only behind the opt-in `rsa-signing` feature and
    # ECDSA responder certificates are the recommended deployment. This scan
    # runs --all-features, so the dependency is flagged regardless. Remove
    # once `rsa` ships the constant-time rewrite (tracked for the 0.10 line).
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin: no fixed version; verify-only by default, signing opt-in via rsa-signing feature" },
    # OOB reads deserializing untrusted rkyv archives containing Rc/Arc.
    # rkyv 0.7.46 is only a lockfile entry: it is the optional, never-enabled
    # rkyv integration of rust_decimal, reached through the pinned openraft
    # fork's byte-unit dependency and never compiled into a workspace artifact.
    # No patched 0.7.x release exists. Remove once rust_decimal's rkyv
    # integration moves to a patched rkyv or the pinned openraft drops it.
    # Mirror of .cargo/audit.toml — keep in sync.
    { id = "RUSTSEC-2026-0235", reason = "rkyv OOB read: never compiled (optional never-enabled rust_decimal feature); no patched 0.7.x release exists" },
    # AsyncFd constructors violate I/O safety (unsound; tokio 1.53.3 deprecates
    # them for AsyncFd::register). The five production constructor sites in
    # opc-sctp, opc-session-store and opc-egress-fence take exclusive ownership
    # of their descriptor and never replace or close it while registered.
    # The GTP-U readiness test borrows its descriptor and retains the owning
    # readiness handle for the entire AsyncFd registration, so the unsoundness
    # is not reachable in these uses. Migrating to AsyncFd::register needs
    # `unsafe` outside the ADR 0017 sys-crate allow-list, so it is tracked as
    # follow-up (ADR route or sys-crate helper).
    # Mirror of .cargo/audit.toml — keep in sync.
    { id = "RUSTSEC-2026-0386", reason = "tokio 1.53.1 AsyncFd I/O-safety: five production sites own their fd; the GTP-U test retains the borrowed fd's owner; no close/replace while registered; unsafe migration blocked by ADR 0017 allow-list (follow-up)" },
    # Timing variability in crypto-bigint operations intended to be
    # constant-time. The 0.7.x line uses non-yanked 0.7.10, retaining the fix
    # introduced in 0.7.6.
    # A crypto-bigint 0.5.5 copy remains only in the audited vendored DTLS fork
    # (dimpl 0.7.2 -> p256/p384 0.13 -> elliptic-curve 0.13.8) consumed by
    # opc-diameter-transport; no 0.5.x fix exists and the fork's rust-crypto
    # backend has not migrated. This is an explicit, scoped risk acceptance:
    # exploiting the timing variability requires a local timing oracle against
    # the DTLS certificate ECDSA path. Upgrading the vendored fork's RustCrypto
    # stack is tracked as follow-up work; do not extend this ignore to the 0.7.x
    # line. Mirror of .cargo/audit.toml — keep in sync.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 only in the vendored DTLS fork (dimpl); non-yanked patched 0.7.10 applied elsewhere; no patched 0.5.x; local-timing risk acceptance pending fork crypto upgrade" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# Scoped exceptions for permissive-but-uncommon licenses on specific crates,
# kept out of the global allow list so new uses still trip the gate.
exceptions = [
    # Mozilla CA bundle data shipped with rustls.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # UEFI-only transitive dependency of getrandom; never built for our targets.
    # cargo-deny 0.17 expects the bare GNU license identifier in exceptions.
    { allow = ["LGPL-2.1"], crate = "r-efi" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/openpacketcore/openraft"]
