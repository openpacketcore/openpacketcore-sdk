[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin Attack timing sidechannel in the `rsa` crate's private-key
    # operations. No fixed release exists upstream. Default builds of
    # opc-proto-ikev2 use the crate for RSA signature *verification* only
    # (public-key operations, outside the advisory's scope); RSA private-key
    # signing is compiled only behind the opt-in `rsa-signing` feature and
    # ECDSA responder certificates are the recommended deployment. This scan
    # runs --all-features, so the dependency is flagged regardless. Remove
    # once `rsa` ships the constant-time rewrite (tracked for the 0.10 line).
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin: no fixed version; verify-only by default, signing opt-in via rsa-signing feature" },
    # OOB reads deserializing untrusted rkyv archives containing Rc/Arc.
    # rkyv 0.7.46 is only a lockfile entry here: it is the optional,
    # never-enabled rkyv integration of rust_decimal, reached through the
    # pinned openraft fork's byte-unit dependency (byte-unit consumes
    # rust_decimal with default features off and nothing enables the rkyv
    # feature), so it is never compiled into or linked by any workspace
    # artifact under any feature set. No patched 0.7.x release exists (the
    # advisory's fix is >= 0.8.17, which rust_decimal 1.42.1's `^0.7.46`
    # requirement cannot reach), and rust_decimal and byte-unit are already
    # at their newest releases. Remove once rust_decimal's rkyv integration
    # moves to a patched rkyv, or the pinned openraft no longer pulls
    # rust_decimal via byte-unit. Mirror of .cargo/audit.toml — keep in sync.
    { id = "RUSTSEC-2026-0235", reason = "rkyv OOB read: never compiled (optional never-enabled rust_decimal feature); no patched 0.7.x release exists" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# Scoped exceptions for permissive-but-uncommon licenses on specific crates,
# kept out of the global allow list so new uses still trip the gate.
exceptions = [
    # Mozilla CA bundle data shipped with rustls.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # UEFI-only transitive dependency of getrandom; never built for our targets.
    # cargo-deny 0.17 expects the bare GNU license identifier in exceptions.
    { allow = ["LGPL-2.1"], crate = "r-efi" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/openpacketcore/openraft"]
