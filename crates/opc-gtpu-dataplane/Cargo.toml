[package]
name = "opc-gtpu-dataplane"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Linux-only safe GTP-U dataplane backend model, mock backend, and redaction-safe errors for OpenPacketCore"
readme = "README.md"
documentation = "https://docs.rs/opc-gtpu-dataplane"
keywords = ["5g", "gtpu", "gtp", "linux", "packet-core"]
categories = ["network-programming", "os::linux-apis"]
publish = false

# This crate is Linux-only: `src/lib.rs` raises a `compile_error!` for any
# `target_os` other than "linux", so a documentation build has to target Linux
# to compile at all. `publish = false` above means docs.rs does not build this
# crate today; the pin is recorded here so the constraint travels with the
# manifest rather than being rediscovered if that ever changes.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
opc-linux-gtpu-sys = { path = "../opc-linux-gtpu-sys", version = "0.2.0" }
opc-gtpu-ebpf-common = { path = "../opc-gtpu-ebpf-common", version = "0.2.0" }
opc-types = { path = "../opc-types", version = "0.2.0" }
async-trait = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14" }
aya-obj = { version = "0.3" }
sha1 = { workspace = true }
sha2 = { workspace = true }
rustix = { version = "1", features = ["fs"] }
# recvmsg/IP_PKTINFO provenance extraction for the reassembly consumer.
nix = { workspace = true, features = ["net", "socket", "uio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# setns() for the privileged multi-netns integration test.
nix = { workspace = true, features = ["net", "sched", "socket", "uio"] }
opc-ipsec-xfrm = { path = "../opc-ipsec-xfrm", version = "0.2.0" }

[lints]
workspace = true
