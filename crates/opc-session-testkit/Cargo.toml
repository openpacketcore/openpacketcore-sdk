[package]
name = "opc-session-testkit"
version = "0.2.0"
publish = false
edition = "2021"
description = "Chaos and failure testing testkit for OpenPacketCore session replication (RFC 004)"

[features]
default = []
foundation-insecure = ["opc-session-net/insecure-test"]
consumer-fixture = ["dep:rcgen", "dep:rustls-pki-types"]

[dependencies]
opc-consensus = { path = "../opc-consensus", version = "0.2.0" }
opc-identity = { path = "../opc-identity", version = "0.2.0" }
opc-key = { path = "../opc-key", version = "0.2.0" }
opc-redaction = { path = "../opc-redaction", version = "0.2.0" }
opc-schema-validate = { path = "../opc-schema-validate", version = "0.2.0" }
opc-session-net = { path = "../opc-session-net", version = "0.2.0", default-features = false }
opc-session-store = { path = "../opc-session-store", version = "0.2.0" }
opc-tls = { path = "../opc-tls", version = "0.2.0" }
opc-types = { path = "../opc-types", version = "0.2.0" }
async-trait = { workspace = true }
futures-util = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "signal", "sync", "time", "test-util"] }
time = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
zeroize = { workspace = true }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
rcgen = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }

[dev-dependencies]
# These integration tests compile under the default (no-fixture) feature set.
# Keep the fixture's production-only dependencies optional above, while making
# the test-only certificate helpers available to Cargo's default test target.
rcgen = { workspace = true }
rustls-pki-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs", "net", "process"] }

[[test]]
name = "qualification_multiprocess"
path = "tests/qualification_multiprocess.rs"
required-features = ["foundation-insecure"]

[[test]]
name = "qualification_control_socket"
path = "tests/qualification_control_socket.rs"
required-features = ["foundation-insecure"]

[[test]]
name = "authenticated_consumer_fixture_public_api"
path = "tests/authenticated_consumer_fixture_public_api.rs"
required-features = ["consumer-fixture"]

[lints]
workspace = true
