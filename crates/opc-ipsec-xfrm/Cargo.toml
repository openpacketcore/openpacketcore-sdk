[package]
name = "opc-ipsec-xfrm"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Safe Linux XFRM IPsec backend model, mock backend, and redaction-safe errors for OpenPacketCore"
readme = "README.md"
documentation = "https://docs.rs/opc-ipsec-xfrm"
keywords = ["5g", "ipsec", "xfrm", "linux", "packet-core"]
categories = ["network-programming", "os::linux-apis"]
publish = false

[features]
default = []
ikev2 = ["dep:opc-proto-ikev2"]
scope-store = ["opc-local-kernel-lifecycle/store"]

[dependencies]
opc-linux-xfrm-sys = { path = "../opc-linux-xfrm-sys", version = "0.2.0" }
opc-linux-gtpu-sys = { path = "../opc-linux-gtpu-sys", version = "0.2.0" }
opc-local-kernel-lifecycle = { path = "../opc-local-kernel-lifecycle", version = "0.2.0" }
opc-ipsec-xfrm-ebpf-common = { path = "../opc-ipsec-xfrm-ebpf-common", version = "0.2.0" }
opc-types = { path = "../opc-types", version = "0.2.0" }
opc-proto-ikev2 = { path = "../opc-proto-ikev2", version = "0.2.0", optional = true }
async-trait = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14" }
aya-obj = { version = "0.3" }
sha1 = { workspace = true }
nix = { workspace = true, features = ["net", "socket"] }

[dev-dependencies]
opc-consensus = { path = "../opc-consensus", version = "0.2.0" }
opc-session-store = { path = "../opc-session-store", version = "0.2.0" }
opc-crypto = { path = "../opc-crypto", version = "0.2.0" }
opc-key = { path = "../opc-key", version = "0.2.0" }
tempfile = "3"
opc-route-steering = { path = "../opc-route-steering", version = "0.2.0" }
aes-gcm = { workspace = true }
hmac = { workspace = true }
opc-crypto-provider = { path = "../opc-crypto-provider", version = "0.2.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { workspace = true, features = ["sched"] }

[lints]
workspace = true
