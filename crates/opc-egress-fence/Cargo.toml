[package]
name = "opc-egress-fence"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lease-bound Linux tc/eBPF egress fencing for OpenPacketCore datagram sockets"
readme = "README.md"
documentation = "https://docs.rs/opc-egress-fence"
keywords = ["ebpf", "fencing", "linux", "network-programming", "high-availability"]
categories = ["network-programming", "os::linux-apis"]
publish = false

[dependencies]
async-trait = { workspace = true }
aya = { version = "0.14" }
nix = { workspace = true, features = ["net", "socket"] }
opc-egress-fence-common = { path = "../opc-egress-fence-common", version = "0.2.0" }
opc-linux-gtpu-sys = { path = "../opc-linux-gtpu-sys", version = "0.2.0" }
opc-linux-xfrm-sys = { path = "../opc-linux-xfrm-sys", version = "0.2.0" }
opc-runtime = { path = "../opc-runtime", version = "0.2.0" }
opc-session-store = { path = "../opc-session-store", version = "0.2.0" }
rand = { workspace = true }
rustix = { version = "1", features = ["fs", "net", "time"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
bytes = { workspace = true }
opc-types = { path = "../opc-types", version = "0.2.0" }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }
