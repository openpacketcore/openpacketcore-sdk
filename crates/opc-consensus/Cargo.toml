[package]
name = "opc-consensus"
version.workspace = true
publish = false # source-build only until the issue #143 Openraft migration gate is satisfied
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared exact-pinned Openraft substrate for OpenPacketCore durable state machines"
readme = "README.md"
documentation = "https://docs.rs/opc-consensus"
keywords = ["5g", "cnf", "consensus", "telecom", "openraft"]
categories = ["network-programming", "data-structures"]

[dependencies]
async-trait = { workspace = true }
openraft = { workspace = true }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
postcard = { workspace = true }
rand = { workspace = true }
rand_08 = { package = "rand", version = "0.8", optional = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
uuid = { workspace = true }

[features]
default = []
dangerous-test-hooks = ["dep:rand_08"]

[dev-dependencies]
rand_08 = { package = "rand", version = "0.8" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
