[package]
name = "opc-local-kernel-lifecycle"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared contained reset barriers for local packet-core kernel backends"
publish = false

[features]
default = []
store = ["dep:opc-session-store"]

[dependencies]
opc-linux-gtpu-sys = { path = "../opc-linux-gtpu-sys", version = "0.2.0" }
opc-route-steering = { path = "../opc-route-steering", version = "0.2.0" }
opc-session-store = { path = "../opc-session-store", version = "0.2.0", optional = true }
async-trait = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
opc-consensus = { path = "../opc-consensus", version = "0.2.0" }
opc-crypto = { path = "../opc-crypto", version = "0.2.0" }
opc-key = { path = "../opc-key", version = "0.2.0" }
tempfile = "3"
opc-types = { path = "../opc-types", version = "0.2.0" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }

[lints]
workspace = true
