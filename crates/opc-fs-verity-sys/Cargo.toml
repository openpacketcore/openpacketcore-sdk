[package]
name = "opc-fs-verity-sys"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Narrow safe fs-verity boundary for fixed OpenPacketCore snapshots"
documentation = "https://docs.rs/opc-fs-verity-sys"
keywords = ["fs-verity", "linux", "integrity", "snapshot", "ffi"]
categories = ["os::linux-apis", "filesystem"]
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
linux-raw-sys.workspace = true

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
