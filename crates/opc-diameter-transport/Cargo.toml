[package]
name = "opc-diameter-transport"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mutually authenticated Diameter-over-TLS/TCP and DTLS/SCTP transports for OpenPacketCore"
readme = "README.md"
publish = false

[dependencies]
bytes = { workspace = true }
# This crate is not published and intentionally binds directly to the audited
# RFC 6083 fork. A workspace-root `[patch]` would not apply when downstream
# products consume this SDK through a Git or path dependency.
dimpl = { path = "../../vendor/dimpl", version = "=0.7.2", default-features = false, features = ["rust-crypto"] }
opc-identity = { path = "../opc-identity", version = "0.2.0" }
opc-proto-diameter = { path = "../opc-proto-diameter", version = "0.2.0", features = ["peer"] }
opc-protocol = { path = "../opc-protocol", version = "0.2.0" }
opc-sctp = { path = "../opc-sctp", version = "0.2.0" }
opc-tls = { path = "../opc-tls", version = "0.2.0" }
opc-types = { path = "../opc-types", version = "0.2.0" }
rand = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-webpki = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
