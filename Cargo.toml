[workspace]
members = [
    "crates/*",
    "crates/opc-proto-gtpu",
]
# The eBPF datapath crates build for bpfel-unknown-none with -Z build-std and
# their own pinned nightly toolchain; they cannot share the host workspace
# build graph. See scripts/build-gtpu-ebpf.sh and scripts/build-ipsec-lb-ebpf.sh.
exclude = [
    "crates/opc-gtpu-dataplane-ebpf",
    "crates/opc-egress-fence-ebpf",
    "crates/opc-ipsec-lb-ebpf",
    "crates/opc-ipsec-xfrm-ebpf",
    # The audited DTLS fork retains its upstream standalone workspace so its
    # own test suite and lockfile remain independently reproducible.
    "vendor/dimpl",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
authors = ["OpenPacketCore Contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/openpacketcore/openpacketcore-sdk"
rust-version = "1.89"

[workspace.dependencies]
linux-raw-sys = { version = "0.12", features = ["ioctl"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tracing = "0.1"
bytes = "1.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
time = "0.3"
async-trait = "0.1"
allocation-counter = "0.8.1"
serde_json = "1.0"
base64 = "0.23.1"
serde_ignored = "0.1"
num_cpus = "1.16"
# HMAC, HKDF, and SHA-2 share digest 0.11 and must migrate together.
# Keep zeroization for key-derived IKEv2, redirect, and journal digest state.
sha2 = { version = "0.11", features = ["zeroize"] }
sha1 = { version = "0.11", features = ["zeroize"] }
rand = "0.10"
# Keep the qualified AES version; patch upgrades are handled by Dependabot.
aes = { version = "=0.9.3", features = ["zeroize"] }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes-gcm-siv = "0.12"
cbc = { version = "0.2.1", default-features = false, features = ["block-padding", "zeroize"] }
hkdf = "0.13"
subtle = "2.6"
zeroize = "1.8"
hmac = { version = "0.13", features = ["zeroize"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1.8", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "ring"] }
x509-parser = { version = "0.18.1" }
# Preserve range-checked u64/usize SQL conversions across all SQLite consumers.
rusqlite = { version = "0.40.2", features = ["fallible_uint"] }
rcgen = { version = "0.14" }
nix = { version = "0.31.3", default-features = false }
openraft = { version = "=0.9.24", git = "https://github.com/openpacketcore/openraft", rev = "dddfe2ee7c51394c1b5ed601c85225ce9eca680d", features = ["serde", "storage-v2", "single-term-leader"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
