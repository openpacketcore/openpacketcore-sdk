name: Egress fence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Egress fence changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust for dependency resolution
        uses: dtolnay/rust-toolchain@stable

      - name: Test the dependency decision
        run: python3 -I ci/test-egress-fence-changes.py

      - name: Decide whether full qualification is needed
        id: decide
        run: python3 -I ci/egress-fence-changes.py

  # Keep the existing required check below as an aggregate. Every workload
  # uses the original fail-closed changes condition and a 45-minute budget.
  sources:
    name: Egress fence sources and eBPF
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install pinned eBPF Rust
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-06-22 \
            --profile minimal \
            --component rust-src \
            --component clippy \
            --component rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: egress-fence-host
          workspaces: . -> target/egress-fence-host

      - name: Cache pinned eBPF compilation
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: egress-fence-ebpf
          workspaces: crates/opc-egress-fence-ebpf -> ../../target/egress-fence-ebpf-clippy

      - name: Install pinned kernel build tools
        run: |
          bash ci/egress-fence-tools.sh --ebpf

      - name: Test exact host-test partition and required check
        run: |
          python3 -I ci/test-egress-fence-tests.py

      - name: Gate host sources
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/egress-fence-host"
          cargo fmt --all --check
          git diff --check
          cargo clippy --locked \
            -p opc-egress-fence \
            -p opc-egress-fence-common \
            -p opc-linux-gtpu-sys \
            -p opc-linux-xfrm-sys \
            -p opc-runtime \
            -p opc-session-store \
            --all-targets \
            --all-features \
            -- \
            -D warnings

      - name: Gate host documentation
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/egress-fence-host"
          RUSTDOCFLAGS="-D warnings" cargo doc --locked \
            -p opc-egress-fence \
            -p opc-egress-fence-common \
            -p opc-linux-gtpu-sys \
            -p opc-linux-xfrm-sys \
            -p opc-runtime \
            -p opc-session-store \
            --all-features \
            --no-deps

      - name: Gate every eBPF feature surface
        run: |
          set -euo pipefail
          cargo +nightly-2026-06-22 fmt \
            --manifest-path crates/opc-egress-fence-ebpf/Cargo.toml \
            --all \
            -- \
            --check
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/egress-fence-ebpf-clippy"
          export RUSTFLAGS="-C linker=bpf-linker -C link-arg=--btf"
          cd crates/opc-egress-fence-ebpf
          cargo +nightly-2026-06-22 clippy --locked \
            --package opc-egress-fence-ebpf \
            -- \
            -D warnings
          cargo +nightly-2026-06-22 clippy --locked \
            --package opc-egress-fence-ebpf \
            --features fault-inject-delete \
            -- \
            -D warnings
          cargo +nightly-2026-06-22 clippy --locked \
            --package opc-egress-fence-ebpf \
            --features mutation-bypass-deadline \
            -- \
            -D warnings
          cargo +nightly-2026-06-22 clippy --locked \
            --package opc-egress-fence-ebpf \
            --no-default-features \
            --features mutation-bypass-gate \
            -- \
            -D warnings

      - name: Rebuild production and test-only objects
        run: |
          set -euo pipefail
          committed="${RUNNER_TEMP}/egress-fence-committed.bpf.o"
          production="${RUNNER_TEMP}/egress-fence-production.bpf.o"
          fault="${RUNNER_TEMP}/egress-fence-fault.bpf.o"
          deadline="${RUNNER_TEMP}/egress-fence-deadline-mutation.bpf.o"
          gate="${RUNNER_TEMP}/egress-fence-gate-mutation.bpf.o"
          cp crates/opc-egress-fence/bpf/opc-egress-fence.bpf.o "${committed}"

          OPC_EBPF_ARTIFACT="${production}" \
          OPC_EBPF_EXPECTED_ARTIFACT="${committed}" \
          OPC_EBPF_TARGET_DIR="${RUNNER_TEMP}/egress-fence-production-a" \
          OPC_EBPF_COMPARISON_TARGET_DIR="${RUNNER_TEMP}/egress-fence-production-b" \
            ./scripts/build-egress-fence-ebpf.sh
          OPC_EBPF_FEATURES=fault-inject-delete \
          OPC_EBPF_ARTIFACT="${fault}" \
          OPC_EBPF_TARGET_DIR="${RUNNER_TEMP}/egress-fence-fault-a" \
          OPC_EBPF_COMPARISON_TARGET_DIR="${RUNNER_TEMP}/egress-fence-fault-b" \
            ./scripts/build-egress-fence-ebpf.sh
          OPC_EBPF_FEATURES=mutation-bypass-deadline \
          OPC_EBPF_ARTIFACT="${deadline}" \
          OPC_EBPF_TARGET_DIR="${RUNNER_TEMP}/egress-fence-deadline-a" \
          OPC_EBPF_COMPARISON_TARGET_DIR="${RUNNER_TEMP}/egress-fence-deadline-b" \
            ./scripts/build-egress-fence-ebpf.sh
          OPC_EBPF_FEATURES=mutation-bypass-gate \
          OPC_EBPF_ARTIFACT="${gate}" \
          OPC_EBPF_TARGET_DIR="${RUNNER_TEMP}/egress-fence-gate-a" \
          OPC_EBPF_COMPARISON_TARGET_DIR="${RUNNER_TEMP}/egress-fence-gate-b" \
            ./scripts/build-egress-fence-ebpf.sh

      - name: Share verified objects with the oracle job
        uses: actions/upload-artifact@v7
        with:
          name: egress-fence-objects
          overwrite: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/egress-fence-committed.bpf.o
            ${{ runner.temp }}/egress-fence-production.bpf.o
            ${{ runner.temp }}/egress-fence-fault.bpf.o
            ${{ runner.temp }}/egress-fence-deadline-mutation.bpf.o
            ${{ runner.temp }}/egress-fence-gate-mutation.bpf.o

      - name: Require complete privileged cleanup
        if: always()
        run: bash ci/egress-fence-cleanup.sh

  oracles:
    name: Egress fence object and mutation oracles
    needs: [changes, sources]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache independent host oracle compilation
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: egress-fence-oracles
          workspaces: crates/opc-egress-fence-ebpf -> ../../target/egress-fence-oracles

      - name: Install kernel inspection tools
        run: |
          bash ci/egress-fence-tools.sh

      - name: Download verified objects from this run
        uses: actions/download-artifact@v8
        with:
          name: egress-fence-objects
          path: ${{ runner.temp }}

      - name: Build and gate independent host oracles
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | awk '/^host:/ { print $2 }')"
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/egress-fence-oracles"
          cargo test --locked \
            --manifest-path crates/opc-egress-fence-ebpf/Cargo.toml \
            --package opc-egress-fence-object-oracle \
            --bins \
            --target "${host_target}"
          cargo build --locked \
            --manifest-path crates/opc-egress-fence-ebpf/Cargo.toml \
            --package opc-egress-fence-object-oracle \
            --bins \
            --target "${host_target}"
          cargo clippy --locked \
            --manifest-path crates/opc-egress-fence-ebpf/Cargo.toml \
            --package opc-egress-fence-object-oracle \
            --bins \
            --target "${host_target}" \
            -- \
            -D warnings
          oracle="${CARGO_TARGET_DIR}/${host_target}/debug/opc-egress-fence-object-oracle"
          crates/opc-egress-fence-ebpf/oracle/scripts/check-oracle-redaction.sh "${oracle}"

      - name: Require the revision-aware host kernel
        run: |
          bash ci/egress-fence-kernel.sh

      - name: Run actual-object, cleanup-fault, and mutation oracles
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | awk '/^host:/ { print $2 }')"
          oracle="${GITHUB_WORKSPACE}/target/egress-fence-oracles/${host_target}/debug/opc-egress-fence-object-oracle"
          production="${RUNNER_TEMP}/egress-fence-committed.bpf.o"
          fault="${RUNNER_TEMP}/egress-fence-fault.bpf.o"
          deadline="${RUNNER_TEMP}/egress-fence-deadline-mutation.bpf.o"
          gate="${RUNNER_TEMP}/egress-fence-gate-mutation.bpf.o"

          sudo env "PATH=${PATH}" "${oracle}" --pressure "${production}"
          sudo env "PATH=${PATH}" "${oracle}" --fault-delete "${fault}"
          OPC_EGRESS_FENCE_PRODUCTION_OBJECT="${production}" \
          OPC_EGRESS_FENCE_DEADLINE_MUTATION_OBJECT="${deadline}" \
          OPC_EGRESS_FENCE_GATE_MUTATION_OBJECT="${gate}" \
          OPC_EGRESS_FENCE_DETECTOR_TARGET_DIR="${RUNNER_TEMP}/egress-fence-detector-target" \
            crates/opc-egress-fence-ebpf/oracle/scripts/run-privileged-detector.sh

      - name: Require complete privileged cleanup
        if: always()
        run: bash ci/egress-fence-cleanup.sh

  installer:
    name: Egress fence production installer
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: egress-fence-host
          workspaces: . -> target/egress-fence-host

      - name: Install kernel inspection tools
        run: |
          bash ci/egress-fence-tools.sh

      - name: Require the revision-aware host kernel
        run: |
          bash ci/egress-fence-kernel.sh

      - name: Run the production installer and adoption proof
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/egress-fence-host"
          build_log="${RUNNER_TEMP}/egress-fence-privileged-build.jsonl"
          cargo test --locked \
            -p opc-egress-fence \
            --lib \
            --no-run \
            --message-format=json \
            > "${build_log}"
          test_binary="$(
            jq -r '
              select(
                .profile.test == true
                and .target.name == "opc_egress_fence"
              )
              | .executable // empty
            ' "${build_log}" \
              | tail -n 1
          )"
          test -n "${test_binary}"
          test -x "${test_binary}"
          test_name="linux_backend::privileged_tests::production_backend_fresh_expiry_adoption_and_prepared_recovery"
          test_inventory="$(
            "${test_binary}" \
              "${test_name}" \
              --exact \
              --ignored \
              --list \
              --format terse
          )"
          if [[ "${test_inventory}" != "${test_name}: test" ]]; then
            printf '%s\n' "egress-fence CI: DEFECTIVE (privileged test unavailable)"
            exit 2
          fi
          sudo env "RUST_BACKTRACE=1" \
            "${test_binary}" \
            "${test_name}" \
            --exact \
            --ignored \
            --nocapture

      - name: Require complete privileged cleanup
        if: always()
        run: bash ci/egress-fence-cleanup.sh

  host-tests:
    name: Egress fence Rust tests (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: egress-fence-tests-${{ matrix.shard }}
          workspaces: . -> target/egress-fence-host

      - name: Install kernel inspection tools
        run: |
          bash ci/egress-fence-tools.sh

      - name: Prepare fs-verity snapshot storage
        run: ci/setup-fsverity-tmp.sh

      - name: Run exact host-test shard
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/egress-fence-host"
          python3 ci/egress-fence-tests.py \
            --shard '${{ matrix.shard }}' \
            --output "${RUNNER_TEMP}/egress-fence-test-map.json"

      - name: Archive the complete test-name mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: egress-fence-test-map-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/egress-fence-test-map.json
          if-no-files-found: error

      - name: Require complete privileged cleanup
        if: always()
        run: bash ci/egress-fence-cleanup.sh

  host-proofs:
    name: Egress fence isolated and O1 proofs
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache isolated proof compilation
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: egress-fence-proofs
          workspaces: . -> target/egress-fence-proofs

      - name: Install kernel inspection tools
        run: |
          bash ci/egress-fence-tools.sh

      - name: Prepare fs-verity snapshot storage
        run: ci/setup-fsverity-tmp.sh

      - name: Run the six isolated and eight O1 proofs
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/egress-fence-proofs"
          python3 ci/egress-fence-tests.py \
            --shard 3 \
            --output "${RUNNER_TEMP}/egress-fence-test-map.json"

      - name: Require complete privileged cleanup
        if: always()
        run: bash ci/egress-fence-cleanup.sh

  # Preserve the old branch-protection check name. A failed, cancelled or
  # missing matrix member makes host-tests unsuccessful and blocks this gate.
  # Only the original successful, explicit changes skip can accept skips.
  root-cgroup-egress:
    name: Root-cgroup egress fence
    if: always()
    needs: [changes, sources, oracles, installer, host-tests, host-proofs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EGRESS_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require every egress-fence job
        run: python3 ci/egress-fence-tests.py --check-jobs
