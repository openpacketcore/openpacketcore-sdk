name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use the PR head's ignore fingerprints, not the synthetic merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > "${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}" gitleaks
          chmod +x gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run gitleaks
        id: scan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              for revision in "${PR_BASE_SHA:?}" "${PR_HEAD_SHA:?}"; do
                git rev-parse --verify --quiet "${revision}^{commit}" >/dev/null || {
                  echo "::error::Secret scan cannot find pull request commit ${revision}"
                  exit 1
                }
              done
              log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              if ! git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- .gitleaksignore .gitleaks.toml; then
                echo "::warning title=Secret scan exceptions changed::This pull request changes .gitleaksignore or .gitleaks.toml. Check that each added line pins one false positive by commit, file, rule and line."
              fi
              ;;
            push)
              # A single revision includes its entire reachable history.
              log_opts="--full-history ${GITHUB_SHA:?}"
              ;;
            schedule|workflow_dispatch)
              git fetch --force --prune origin \
                '+refs/heads/*:refs/secret-scan/heads/*' '+refs/tags/*:refs/secret-scan/tags/*'
              log_opts="--full-history --all"
              ;;
            *)
              echo "::error::Unsupported secret-scan event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          report="${RUNNER_TEMP}/gitleaks-report.json"
          log="${RUNNER_TEMP}/gitleaks.log"
          finding_reports=()
          scan_pass() {
            local pass_opts="$1" pass_report="$2" pass_log="$3" pass_status=0
            rm -f -- "$pass_report" || return $?
            # Exit 2 means findings. Any other non-zero status is an incomplete scan.
            NO_COLOR=1 gitleaks detect --source . --redact --no-banner --exit-code 2 \
              --report-format json --report-path "$pass_report" --log-opts "$pass_opts" \
              2> "$pass_log" || pass_status=$?
            cat "$pass_log" >&2 || return $?
            # 8.30.1 can exit 0 after git log fails. Require its clean-result line.
            if [[ "$pass_status" -eq 0 ]]; then
              if grep -q -E '^[^ ]+ (ERR|FTL) ' "$pass_log"; then
                echo "::error::The scanner logged an error; this is not a clean result."
                pass_status=1
              elif ! grep -q -E '^[^ ]+ INF no leaks found$' "$pass_log"; then
                echo "::error::The scanner did not log \"no leaks found\"; this is not a clean result."
                pass_status=1
              fi
            fi
            if [[ "$pass_status" -eq 2 ]]; then
              finding_reports+=("$pass_report")
            fi
            return "$pass_status"
          }

          # Keep the ordinary walk and its original-commit ignore fingerprints.
          status=0
          scan_pass "$log_opts" "$report" "$log" || status=$?
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            exit "$status"
          fi

          # A clean automatic merge contains no resolution edits. Its parent
          # additions were already scanned, so do not give them new fingerprints.
          # Walk every merge, including nested merges on side branches.
          read -r -a log_args <<< "$log_opts"
          git rev-list --merges "${log_args[@]}" > "${RUNNER_TEMP}/gitleaks-merges.txt"
          selected_merges=()
          while read -r merge; do
            merge_metadata="$(git show --no-patch --format='%T %P' "$merge")"
            read -r -a metadata <<< "$merge_metadata"
            if [[ "${#metadata[@]}" -eq 3 ]]; then
              merge_status=0
              git merge-tree --write-tree --allow-unrelated-histories \
                "${metadata[1]}" "${metadata[2]}" \
                > "${RUNNER_TEMP}/gitleaks-auto-merge.txt" \
                2> "${RUNNER_TEMP}/gitleaks-auto-merge.log" || merge_status=$?
              cat "${RUNNER_TEMP}/gitleaks-auto-merge.log" >&2
              if [[ "$merge_status" -ne 0 && "$merge_status" -ne 1 ]]; then
                echo "::error::Cannot classify merge ${merge}: git merge-tree exited ${merge_status}."
                exit 1
              fi
              IFS= read -r automatic_tree < "${RUNNER_TEMP}/gitleaks-auto-merge.txt" || {
                echo "::error::Cannot classify merge ${merge}: missing automatic tree."
                exit 1
              }
              if [[ ! "$automatic_tree" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
                echo "::error::Cannot classify merge ${merge}: invalid automatic tree."
                exit 1
              fi
              if [[ "$merge_status" -eq 0 && "$automatic_tree" == "${metadata[0]}" ]]; then
                continue
              fi
            elif [[ "${#metadata[@]}" -lt 4 ]]; then
              echo "::error::Cannot classify merge ${merge}: missing parents."
              exit 1
            fi
            # Always scan conflicts, edited automatic merges, and octopus merges.
            selected_merges+=("$merge")
          done < "${RUNNER_TEMP}/gitleaks-merges.txt"

          # Bound argv size without dropping a commit. Each selected merge is
          # scanned once; --no-walk prevents rescanning its ordinary ancestors.
          for ((offset=0; offset<${#selected_merges[@]}; offset+=512)); do
            batch=("${selected_merges[@]:offset:512}")
            merge_scan_status=0
            echo "Secret scan merge-resolution batch $((offset / 512 + 1))" >&2
            scan_pass "--diff-merges=first-parent --no-walk ${batch[*]}" \
              "${RUNNER_TEMP}/gitleaks-merge-${offset}.json" \
              "${RUNNER_TEMP}/gitleaks-merge-${offset}.log" || merge_scan_status=$?
            if [[ "$merge_scan_status" -ne 0 && "$merge_scan_status" -ne 2 ]]; then
              exit "$merge_scan_status"
            elif [[ "$merge_scan_status" -eq 2 ]]; then
              status=2
            fi
          done

          # Keep one complete report/count, including when ordinary commits leak.
          # A pass rejected above never publishes a misleading partial count.
          if [[ "$status" -eq 2 ]]; then
            count="$(python3 - "$report" "${finding_reports[@]}" <<'PY'
          import json
          import sys

          findings = []
          for path in sys.argv[2:]:
              with open(path) as source:
                  report = json.load(source)
              if not isinstance(report, list):
                  raise ValueError('scanner report is not a JSON array')
              findings.extend(report)
          with open(sys.argv[1], 'w') as output:
              json.dump(findings, output)
          print(len(findings))
          PY
            )"
            echo "findings=${count}" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

  report-scheduled-secret-scan:
    name: Report scheduled secret scan failure
    needs: secret-scan
    if: always() && github.event_name == 'schedule' && needs.secret-scan.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: scheduled-secret-scan-report
      cancel-in-progress: false
    steps:
      - name: Open or update the secret scan issue
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_RESULT: ${{ needs.secret-scan.result }}
          SCAN_FINDINGS: ${{ needs.secret-scan.outputs.findings }}
        shell: bash
        run: |
          set -euo pipefail
          label=secret-scan
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description 'Scheduled all-ref secret scan findings or failures'
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          body_file="${RUNNER_TEMP}/secret-scan-issue.md"
          if [[ "$SCAN_FINDINGS" =~ ^[0-9]+$ ]]; then
            detail="Findings: ${SCAN_FINDINGS}."
          else
            detail='No finding count was passed on: the scan found something or did not complete. This is not a clean result.'
          fi
          printf '%s\n' \
            "Scheduled all-ref secret scan: **${SCAN_RESULT}**. ${detail}" \
            "[Workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            '' \
            'The run log shows only the total and redacts values. To list the findings, fetch all refs as the workflow does and run the same gitleaks command with --verbose. This issue does not block unrelated pull requests.' \
            > "$body_file"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
              --title 'Scheduled secret scan needs review' --body-file "$body_file"
          fi

  rust-advisories:
    name: Rust advisory scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          root = Path.cwd().resolve()
          registry = "registry+https://github.com/rust-lang/crates.io-index"

          def fail(lockfile, detail):
              raise SystemExit(f"{lockfile}: {detail}")

          def stable_version(value):
              match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\+[0-9A-Za-z.-]+)?", value)
              return tuple(map(int, match.groups())) if match else None

          # Library consumers resolve from the manifest, not this repository's lock.
          ike = root / "crates/opc-proto-ikev2/Cargo.toml"
          requirement = tomllib.loads(ike.read_text())["dependencies"]["crypto-bigint"]["version"]
          floor = stable_version(requirement)
          if floor is None or floor < (0, 7, 6):
              fail(ike, "crypto-bigint must require a patched stable release (>= 0.7.6)")

          # All incoming edges must remain within this exact reviewed stack.
          allowed = {
              ("crypto-bigint", "0.5.5"): {("elliptic-curve", "0.13.8")},
              ("elliptic-curve", "0.13.8"): {("ecdsa", "0.16.9"), ("primeorder", "0.13.6"),
                                             ("p256", "0.13.2"), ("p384", "0.13.1")},
              ("ecdsa", "0.16.9"): {("p256", "0.13.2"), ("p384", "0.13.1"), ("dimpl", "0.7.2")},
              ("primeorder", "0.13.6"): {("p256", "0.13.2"), ("p384", "0.13.1")},
              ("p256", "0.13.2"): {("dimpl", "0.7.2")},
              ("p384", "0.13.1"): {("dimpl", "0.7.2")},
              ("dimpl", "0.7.2"): {("opc-diameter-transport", "0.2.0")},
          }
          local = {
              ("dimpl", "0.7.2"): root / "vendor/dimpl/Cargo.toml",
              ("opc-diameter-transport", "0.2.0"): root / "crates/opc-diameter-transport/Cargo.toml",
          }

          def check_paths(packages, parents, lockfile, resolved=False):
              pending = [identifier for identifier, package in packages.items()
                         if (package["name"], package["version"]) == ("crypto-bigint", "0.5.5")]
              if len(pending) != 1:
                  fail(lockfile, "cannot verify the locked crypto-bigint 0.5.5 dependency path")
              seen = set()
              while pending:
                  identifier = pending.pop()
                  if identifier in seen:
                      continue
                  seen.add(identifier)
                  package = packages[identifier]
                  key = package["name"], package["version"]
                  if key in local:
                      if package.get("source") is not None or (resolved and
                              Path(package["manifest_path"]).resolve() != local[key]):
                          fail(lockfile, f"legacy crypto path must use the checked-in {key[0]}")
                  elif package.get("source") != registry:
                      fail(lockfile, f"legacy crypto path has an unexpected source for {key[0]}")
                  incoming = parents[identifier]
                  if key == ("opc-diameter-transport", "0.2.0"):
                      continue
                  # The same checked-in fork also has its own test workspace.
                  if (key == ("dimpl", "0.7.2") and not incoming
                          and lockfile == Path("vendor/dimpl/Cargo.lock")):
                      continue
                  if not incoming:
                      fail(lockfile, f"legacy crypto path ends before the vendored DTLS consumer: {key}")
                  for parent in incoming:
                      other = packages[parent]
                      if (other["name"], other["version"]) not in allowed.get(key, set()):
                          fail(lockfile, f"unaccepted legacy crypto dependency: {other['name']} -> {key[0]}")
                      pending.append(parent)

          def check_locked_paths(lock, lockfile):
              # Cargo.lock includes optional edges absent from enabled metadata.
              packages = {(p["name"], p["version"], p.get("source")): p for p in lock["package"]}
              if len(packages) != len(lock["package"]):
                  fail(lockfile, "duplicate locked package identity")
              parents = {identifier: set() for identifier in packages}
              for identifier, package in packages.items():
                  for dependency in package.get("dependencies", []):
                      parts = dependency.split(" ", 2)
                      matches = [key for key in packages if key[0] == parts[0]
                                 and (len(parts) < 2 or key[1] == parts[1])
                                 and (len(parts) < 3 or f"({key[2]})" == parts[2])]
                      if len(matches) != 1:
                          fail(lockfile, f"cannot resolve locked dependency {dependency!r}")
                      parents[matches[0]].add(identifier)
              check_paths(packages, parents, lockfile)

          def check_resolved_paths(metadata, lockfile):
              packages = {package["id"]: package for package in metadata["packages"]}
              parents = {identifier: set() for identifier in packages}
              for node in metadata["resolve"]["nodes"]:
                  for dependency in node["deps"]:
                      parents[dependency["pkg"]].add(node["id"])
              check_paths(packages, parents, lockfile, resolved=True)

          tracked = subprocess.check_output(["git", "ls-files", "-z", "--", "Cargo.lock", "**/Cargo.lock",
                                             ":(exclude)ci/fixtures/**"])
          lockfiles = [Path(os.fsdecode(name)) for name in tracked.split(b"\0") if name]
          if not lockfiles or Path("Cargo.lock") not in lockfiles:
              raise SystemExit("no tracked root Cargo.lock to audit")
          database = str(Path(os.environ["RUNNER_TEMP"]) / "cargo-advisory-db")
          for index, lockfile in enumerate(lockfiles):
              lock = tomllib.loads(lockfile.read_text())
              legacy = False
              for package in lock["package"]:
                  if package["name"] != "crypto-bigint":
                      continue
                  version = stable_version(package["version"])
                  if package.get("source") != registry:
                      fail(lockfile, "crypto-bigint must use the reviewed registry source")
                  if package["version"] == "0.5.5":
                      legacy = True
                  elif version is None or version < (0, 7, 6):
                      fail(lockfile, f"RUSTSEC-2026-0387 is not accepted for crypto-bigint {package['version']}")
              if legacy:
                  check_locked_paths(lock, lockfile)
              manifest = str(lockfile.with_name("Cargo.toml"))
              subprocess.run(["cargo", "fetch", "--locked", "--manifest-path", manifest], check=True)
              metadata = json.loads(subprocess.check_output([
                  "cargo", "metadata", "--locked", "--offline", "--all-features", "--format-version", "1",
                  "--manifest-path", manifest,
              ]))
              if legacy:
                  check_resolved_paths(metadata, lockfile)
              command = ["cargo", "audit", "--db", database, "--deny", "warnings", "--file", str(lockfile)]
              if index:
                  command.append("--no-fetch")
              subprocess.run(command, check=True)
          print(f"Audited {len(lockfiles)} tracked Cargo lockfiles; legacy crypto exception checked.")
          PY

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run cargo-deny
        # v2; immutable pin
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  go-vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: operators/sdk-reference-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operators/sdk-reference-operator/go.mod
          cache-dependency-path: operators/sdk-reference-operator/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
