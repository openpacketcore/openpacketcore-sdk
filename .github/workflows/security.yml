name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use the PR head's ignore fingerprints, not the synthetic merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > "${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}" gitleaks
          chmod +x gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run gitleaks
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              log_opts="${PR_BASE_SHA:?}..${PR_HEAD_SHA:?}"
              ;;
            push|workflow_dispatch)
              # A single revision includes its entire reachable history.
              log_opts="--full-history ${GITHUB_SHA:?}"
              ;;
            schedule)
              git fetch --force --prune origin '+refs/*:refs/secret-scan/*'
              log_opts="--full-history --all"
              ;;
            *)
              echo "::error::Unsupported secret-scan event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          gitleaks detect --source . --redact --no-banner --log-opts "$log_opts"

  report-scheduled-secret-scan:
    name: Report scheduled secret scan failure
    needs: secret-scan
    if: always() && github.event_name == 'schedule' && needs.secret-scan.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: scheduled-secret-scan-report
      cancel-in-progress: false
    steps:
      - name: Open or update the secret scan issue
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_RESULT: ${{ needs.secret-scan.result }}
        shell: bash
        run: |
          set -euo pipefail
          label=secret-scan
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description 'Scheduled all-ref secret scan findings or failures'
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          body_file="${RUNNER_TEMP}/secret-scan-issue.md"
          printf '%s\n' \
            "Scheduled all-ref secret scan: **${SCAN_RESULT}**." \
            "[Workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            '' \
            'Review the redacted scan log for findings or setup failures. This issue does not block unrelated pull requests.' \
            > "$body_file"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
              --title 'Scheduled secret scan needs review' --body-file "$body_file"
          fi

  rust-advisories:
    name: Rust advisory scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --db "${RUNNER_TEMP}/cargo-advisory-db" --deny warnings

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run cargo-deny
        # v2; immutable pin
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  go-vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: operators/sdk-reference-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operators/sdk-reference-operator/go.mod
          cache-dependency-path: operators/sdk-reference-operator/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
