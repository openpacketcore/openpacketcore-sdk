name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use the PR head's ignore fingerprints, not the synthetic merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > "${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}" gitleaks
          chmod +x gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run gitleaks
        id: scan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              for revision in "${PR_BASE_SHA:?}" "${PR_HEAD_SHA:?}"; do
                git rev-parse --verify --quiet "${revision}^{commit}" >/dev/null || {
                  echo "::error::Secret scan cannot find pull request commit ${revision}"
                  exit 1
                }
              done
              log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              if ! git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- .gitleaksignore .gitleaks.toml; then
                echo "::warning title=Secret scan exceptions changed::This pull request changes .gitleaksignore or .gitleaks.toml. Check that each added line pins one false positive by commit, file, rule and line."
              fi
              ;;
            push)
              # A single revision includes its entire reachable history.
              log_opts="--full-history ${GITHUB_SHA:?}"
              ;;
            schedule|workflow_dispatch)
              git fetch --force --prune origin \
                '+refs/heads/*:refs/secret-scan/heads/*' '+refs/tags/*:refs/secret-scan/tags/*'
              log_opts="--full-history --all"
              ;;
            *)
              echo "::error::Unsupported secret-scan event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          report="${RUNNER_TEMP}/gitleaks-report.json"
          log="${RUNNER_TEMP}/gitleaks.log"
          status=0
          # Exit 2 means findings. Any other non-zero status means the scan did not complete.
          gitleaks detect --source . --redact --no-banner --exit-code 2 \
            --report-format json --report-path "$report" --log-opts "$log_opts" 2> "$log" || status=$?
          cat "$log" >&2
          # gitleaks 8.30.1 exits 0 when its git log fails; it only logs the failure.
          if [[ "$status" -eq 0 ]] && grep -q -E '^[^ ]+ (ERR|FTL) ' "$log"; then
            echo "::error::The scanner logged an error; this is not a clean result."
            status=1
          fi
          if [[ "$status" -eq 2 ]]; then
            count="$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))))' "$report")"
            echo "findings=${count}" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

  report-scheduled-secret-scan:
    name: Report scheduled secret scan failure
    needs: secret-scan
    if: always() && github.event_name == 'schedule' && needs.secret-scan.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: scheduled-secret-scan-report
      cancel-in-progress: false
    steps:
      - name: Open or update the secret scan issue
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_RESULT: ${{ needs.secret-scan.result }}
          SCAN_FINDINGS: ${{ needs.secret-scan.outputs.findings }}
        shell: bash
        run: |
          set -euo pipefail
          label=secret-scan
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description 'Scheduled all-ref secret scan findings or failures'
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          body_file="${RUNNER_TEMP}/secret-scan-issue.md"
          if [[ "$SCAN_FINDINGS" =~ ^[0-9]+$ ]]; then
            detail="Findings: ${SCAN_FINDINGS}."
          else
            detail='No finding count was passed on: the scan found something or did not complete. This is not a clean result.'
          fi
          printf '%s\n' \
            "Scheduled all-ref secret scan: **${SCAN_RESULT}**. ${detail}" \
            "[Workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            '' \
            'The run log shows only the total and redacts values. To list the findings, fetch all refs as the workflow does and run the same gitleaks command with --verbose. This issue does not block unrelated pull requests.' \
            > "$body_file"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
              --title 'Scheduled secret scan needs review' --body-file "$body_file"
          fi

  rust-advisories:
    name: Rust advisory scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --db "${RUNNER_TEMP}/cargo-advisory-db" --deny warnings

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run cargo-deny
        # v2; immutable pin
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  go-vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: operators/sdk-reference-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operators/sdk-reference-operator/go.mod
          cache-dependency-path: operators/sdk-reference-operator/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
