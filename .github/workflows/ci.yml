name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-856-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic-856:
    name: Bounded 856 original shard context
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v7
        with:
          # The driver restores the historical workflow as precheck input.
          fetch-depth: 0
      - name: Install exact qualified Rust version
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Prepare standard snapshot storage
        run: ci/setup-fsverity-tmp.sh
      - name: Restore ordinary miscellaneous shard dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-rust-tests-misc
          save-if: false
      - name: Run original miscellaneous shard prefix through target
        run: python3 ci/diagnose-856.py
      - name: Preserve every command and exact source metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-856
          path: diagnostic-856/
          if-no-files-found: error
