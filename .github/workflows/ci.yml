name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-856-paired-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic-856:
    name: Paired 856 source comparison on one standard runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout diagnostic harness only
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare both fixed unmodified source trees
        run: |
          git worktree add --detach source-original be7b580986b7efaf87b7aa79b13f55d5d32956c1
          git worktree add --detach source-current-main 75044f43852cd816d9734d03914515395bf20c69
      - name: Install original qualified Rust version
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Prepare shared standard snapshot storage
        run: |
          cmp source-original/ci/setup-fsverity-tmp.sh source-current-main/ci/setup-fsverity-tmp.sh
          source-current-main/ci/setup-fsverity-tmp.sh
      - name: Compile both sources then run the fixed alternating plan
        run: python3 ci/diagnose-856-paired.py --original source-original --current source-current-main --output diagnostic-856-paired
      - name: Preserve the paired results and first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-856-paired
          path: diagnostic-856-paired/
          if-no-files-found: error
