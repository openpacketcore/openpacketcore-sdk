name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-856-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic-856:
    name: Runtime comparison (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [paired-1, paired-2]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout diagnostic harness only
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare fixed baseline and attribute-only runtime variant
        run: |
          git worktree add --detach source-current-main 75044f43852cd816d9734d03914515395bf20c69
          git worktree add --detach source-runtime-1 64c2ccda4ee5714025f25a458019272349d5e3d1
      - name: Install original qualified Rust version
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Prepare shared standard snapshot storage
        run: |
          cmp source-current-main/ci/setup-fsverity-tmp.sh source-runtime-1/ci/setup-fsverity-tmp.sh
          source-current-main/ci/setup-fsverity-tmp.sh
      - name: Compile both sources then run the fixed ABBA comparison
        run: python3 ci/diagnose-856-paired.py --current source-current-main --variant source-runtime-1 --output diagnostic-856-runtime
      - name: Preserve paired results and first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-856-runtime-${{ matrix.profile }}
          path: diagnostic-856-runtime/
          if-no-files-found: error
