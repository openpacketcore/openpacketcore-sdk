name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# The shard matrices and standalone lanes run on separate runners. Without a
# concurrency group a superseded push keeps its whole fleet running and the
# replacement run queues behind it, which costs far more wall clock than the
# sharding saves. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_BACKTRACE: "1"

jobs:
  # Also runs independently on train/** pushes through the reusable workflow.
  # Every PR reaches it here, and Rust workspace requires its success below.
  test-inventory:
    name: Test inventory guard
    uses: ./.github/workflows/test-inventory.yml
    permissions:
      contents: read
      issues: read

  # The former single "Rust workspace" job ran fmt, clippy, the whole test
  # suite and the isolated lanes back to back for ~42 minutes, with the test
  # step alone taking ~34 (451 test binaries executed one after another).
  # It is now split across runners: the lanes below do the work and the
  # aggregator job at the end still reports one "Rust workspace" check.
  # Debug symbols dominate the hosted runner's disk budget for this large
  # all-target workspace, so its build lanes keep them off. CI validates
  # behavior and diagnostics without retaining symbol tables; release-profile
  # artifacts are unaffected. These pins are also what keeps each lane's
  # target directory small enough that no lane needs `cargo clean`. The native
  # lifecycle lane retains its original qualification build profile.
  rust-gates:
    name: Rust gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PR whitespace validation compares the event's base and head, so
          # retain enough history to resolve their exact merge-base.
          fetch-depth: 0

      - name: Require nightly qualification failures to be classified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/nightly_qualification.py check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-rust-gates

      - name: Check every Cargo lockfile
        run: |
          set -euo pipefail
          while IFS= read -r -d '' lockfile; do
            manifest="${lockfile%Cargo.lock}Cargo.toml"
            # Fetch with the lock intact so fresh runners can then resolve
            # every separate workspace without accessing the network.
            cargo fetch --locked --manifest-path "$manifest"
            cargo metadata --locked --offline --format-version 1 \
              --manifest-path "$manifest" > /dev/null
          done < <(git ls-files -z -- Cargo.lock '**/Cargo.lock' ':(exclude)ci/fixtures/**')

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check XFRM dependency contract
        run: python3 ci/check-xfrm-dependency-contract.py

      - name: Check diff whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            merge_base="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
            git diff --check "${merge_base}..${PR_HEAD_SHA}"
          else
            git diff --check
          fi

      - name: Check untimed scope authority
        run: |
          if ! command -v rg > /dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ripgrep
          fi
          bash scripts/check-scope-authority-untimed.sh

      - name: Run management-plane policy gates
        run: |
          python3 scripts/check-management-plane-policy.py --self-test
          python3 scripts/check-management-plane-policy.py --check

      - name: Run N3IWF fixture-contract gates
        run: |
          python3 scripts/check-n3iwf-fixture-contracts.py --self-test
          python3 scripts/check-n3iwf-fixture-contracts.py --check
      - name: Check independent NWu GRE reference vectors
        run: python3 crates/opc-proto-gre/tests/reference.py --check

      - name: Check scope transport revision-2 reference vectors
        run: python3 docs/rfc/026-scope-transport-revision2-vectors.py --check

      - name: Check GTP-U extension-list reference vectors
        run: python3 crates/opc-proto-gtpu/tests/fixtures/extension_list.py --check

      - name: Check shared GTP-U control receive/response vectors
        run: python3 crates/opc-gtpu-dataplane/tests/fixtures/control_port.py --check

      - name: Validate complete NGAP messages with independent Release 18 ASN.1
        run: |
          python3 -m venv "${RUNNER_TEMP}/ngap-reference"
          "${RUNNER_TEMP}/ngap-reference/bin/pip" install --require-hashes --only-binary=:all: \
            -r scripts/n3iwf-ngap-reference-requirements.txt
          "${RUNNER_TEMP}/ngap-reference/bin/python" scripts/check-n3iwf-ngap-reference.py \
            --report "${RUNNER_TEMP}/ngap-reference-report.json"

      - name: Check independent N3 packet vectors
        run: python3 crates/opc-gtpu-dataplane/tests/n3_reference.py --check

      - name: Archive independent NGAP validation report
        uses: actions/upload-artifact@v7
        with:
          name: ngap-independent-release18-reference
          path: ${{ runner.temp }}/ngap-reference-report.json
          if-no-files-found: error

      - name: Verify independent synthetic IKE AUTH known answers
        run: |
          python3 scripts/n3iwf_key_reference.py \
            --report "${RUNNER_TEMP}/ike-auth-reference-report.json"

      - name: Archive independent IKE AUTH validation report
        uses: actions/upload-artifact@v7
        with:
          name: n3iwf-independent-ike-auth-reference
          path: ${{ runner.temp }}/ike-auth-reference-report.json
          if-no-files-found: error

      - name: Test SDK-702 release-attestation wrapper environment
        run: |
          python3 ci/test-sdk702-release-attest.py
          bash -n ci/setup-fsverity-tmp.sh

      - name: Test nohz guest reboot handoff
        run: |
          python3 ci/test-download-image.py
          bash -n ci/download-image.sh
          python3 ci/test-qualify-tft-nohz-vm.py
          bash -n ci/qualify-tft-nohz-vm.sh

      - name: Test local lifecycle qualification and CI cleanup
        run: python3 ci/test-qualify-local-kernel-lifecycle.py

      - name: Test live voter memory evidence validators
        run: python3 scripts/test-observe-session-store-live-memory.py

      - name: Run opc-proto-diameter corpus generator self-test
        run: python3 crates/opc-proto-diameter/fuzz/generate_corpus.py self-test

      # A workflow expression error makes GitHub reject the whole file and
      # produce a run with no jobs at all, which reads as "nothing to see"
      # rather than as a failure. Lint the workflows so that fails a check.
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: v1.7.12
          PYFLAKES_VERSION: 3.4.0
        run: |
          set -euo pipefail
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          # actionlint lints embedded shell with shellcheck and embedded
          # python with pyflakes, but only if it can execute them. The runner
          # image ships shellcheck and not pyflakes, so supply pyflakes in a
          # venv rather than let the rule quietly switch itself off.
          python3 -m venv /tmp/actionlint-venv
          /tmp/actionlint-venv/bin/pip install --quiet "pyflakes==${PYFLAKES_VERSION}"
          export PATH="/tmp/actionlint-venv/bin:${PATH}"
          # A missing tool is reported only in verbose output, so a run that
          # checks far less than it appears to still exits 0. Fail instead.
          "$(go env GOPATH)/bin/actionlint" -verbose .github/workflows/*.yml \
            2> >(tee actionlint.err >&2)
          if grep -q 'was disabled' actionlint.err; then
            grep 'was disabled' actionlint.err
            echo "::error::actionlint ran with rules disabled; install the missing tools"
            exit 1
          fi

      # Proves the test plan still partitions every integration-test target
      # exactly once. The shards do not wait on this job -- they run the same
      # check themselves in their precheck step -- so this is the readable
      # place to see a plan failure, not the thing that gates them.
      - name: Test test-shard manifest audit
        run: |
          python3 ci/test-test-shards.py
          python3 ci/test-library-partition.py
          python3 ci/test-performance-tests.py
          python3 ci/test-realtime-qualification.py
          python3 -I ci/test-egress-fence-tests.py

      - name: Verify test shard plan
        run: python3 ci/test-shards.py verify

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-rust-clippy

      - name: Run clippy
        run: |
          cargo fetch --locked
          python3 ci/test-clippy-fd-guard.py
          cargo clippy --locked -p opc-ipsec-xfrm --lib --no-default-features -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Compile-check non-Linux targets (default features)
        run: |
          rustup target add x86_64-unknown-freebsd aarch64-apple-darwin
          cargo clippy --locked \
            -p opc-gtpu-dataplane -p opc-linux-gtpu-sys -p opc-session-store \
            -p opc-fs-verity-sys -p opc-sqlite-file-control-sys \
            -p opc-session-testkit -p opc-persist -p opc-peer-discovery \
            --all-targets --target x86_64-unknown-freebsd -- -D warnings
          # The other five crates above need an Apple C toolchain for bundled
          # SQLite and/or ring. Check the sys crates and DNS client on Apple too.
          cargo clippy --locked -p opc-linux-gtpu-sys -p opc-fs-verity-sys -p opc-peer-discovery \
            --all-targets --target aarch64-apple-darwin -- -D warnings
          # Runtime test targets pull in AWS-LC through opc-sbi and need a
          # target C toolchain. Its library can be checked on both targets.
          for target in x86_64-unknown-freebsd aarch64-apple-darwin; do
            cargo clippy --locked -p opc-runtime --lib --target "$target" -- -D warnings
          done

  rust-tests:
    name: Rust tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The planner also lists the separate native-log proof shards. Its
        # plan check fails the run if the plan itself stops covering
        # everything, and the aggregator below fails if a shard is dropped.
        shard: [misc, quiescent-o1, it-0, it-1, it-2, it-3, it-4, heavy-0, heavy-1]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare disk-backed scratch
        run: bash ci/disk-scratch.sh prepare

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      # Each shard builds only its own test targets, so the tree stays far
      # below the former single-job peak that forced `cargo clean` between
      # steps. Debug symbols remain off via CARGO_PROFILE_*_DEBUG above; do
      # not add a `cargo clean` here, since rust-cache saves in a post-step
      # and would archive an empty target directory.
      # Per-shard keys: the legs build different target sets, so one shared
      # key would make all runners race to save the same multi-gigabyte archive
      # while giving each a worse hit rate than its own. Only main saves:
      # an archive per shard per pull request would churn the repository's shared
      # 10 GB cache quota and evict the entries the shards restore from.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-rust-tests-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Every shard issues the identical package selection and differs only
      # in cargo target filters, so feature unification -- and therefore the
      # compiled configuration of every dependency -- matches the former
      # single-job run exactly.
      # Resolves this shard's named tests before running anything: libtest
      # exits 0 when a filter matches nothing, so a rename would otherwise
      # leave a heavy shard green having run nothing.
      - name: Precheck shard selection
        run: python3 ci/test-shards.py precheck --shard '${{ matrix.shard }}' --split-libraries

      - name: Run test shard
        shell: bash ci/setup-fsverity-tmp.sh -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python3 ci/test-shards.py plan --shard '${{ matrix.shard }}' --split-libraries > shard-commands.txt
          test -s shard-commands.txt
          # The command list is read on fd 3, and each command gets its own
          # stdin from /dev/null. Reading the list on stdin instead would let
          # any test that spawns a child with inherited stdin drain the
          # remaining lines, silently skipping the rest of the shard.
          while IFS= read -r command <&3; do
            echo "::group::${command}"
            if ! eval "${command}" < /dev/null; then
              echo "::endgroup::"
              echo "::error::shard '${{ matrix.shard }}' failed: ${command}"
              exit 1
            fi
            echo "::endgroup::"
          done 3< shard-commands.txt

      # Cheap: the binary is already built on this shard.
      - name: Verify heavy-target test partition
        if: matrix.shard == 'misc'
        run: python3 ci/test-shards.py verify-heavy

      - name: Remove disk-backed scratch
        if: always() && env.OPC_CI_DISK_TMPDIR != ''
        run: bash ci/disk-scratch.sh cleanup

  # Mixed O0/O1 precheck took 38 minutes on hosted heavy-1; leader progress
  # projects another 27 minutes. One proof per runner, with a 90-minute job
  # budget for compilation, reopen and host variance. Test deadlines are intact.
  rust-native-log-proofs:
    name: Rust full-bound store proof (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The signed 131,073-roster proof includes complete cold reconstruction.
    timeout-minutes: ${{ matrix.shard == 'roster-history' && 240 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [native-log-0, native-log-1, native-log-2, native-log-3, native-log-4, native-log-5, native-log-6, native-log-7, native-log-8, native-log-9, native-log-10, native-log-11, native-log-12, native-log-13, roster-history]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare disk-backed scratch
        run: bash ci/disk-scratch.sh prepare

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-rust-native-log
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Precheck shard selection
        run: python3 ci/test-shards.py precheck --shard '${{ matrix.shard }}'

      - name: Run test shard
        shell: bash ci/setup-fsverity-tmp.sh -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python3 ci/test-shards.py plan --shard '${{ matrix.shard }}' > shard-commands.txt
          test -s shard-commands.txt
          while IFS= read -r command <&3; do
            echo "::group::${command}"
            if ! eval "${command}" < /dev/null; then
              echo "::endgroup::"
              echo "::error::shard '${{ matrix.shard }}' failed: ${command}"
              exit 1
            fi
            echo "::endgroup::"
          done 3< shard-commands.txt

      - name: Remove disk-backed scratch
        if: always() && env.OPC_CI_DISK_TMPDIR != ''
        run: bash ci/disk-scratch.sh cleanup


  # Spread the ordinary library work with headroom below the 60-minute cap.
  # All runners preserve workspace feature unification and the O0 profile;
  # exact names, including future tests, are distributed by a live inventory.
  rust-libraries:
    name: Rust library tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare disk-backed scratch
        run: bash ci/disk-scratch.sh prepare

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-rust-libraries
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check production diagnostic silence without test-control
        if: matrix.shard == 0
        run: |
          cargo test --locked -p opc-session-net --no-default-features --lib \
            consumer::tests::v2_diagnostics_tests:: -- --test-threads=1
          cargo test --locked -p opc-session-net --no-default-features --lib \
            consensus::tests::transport_diagnostics:: -- --test-threads=1

      - name: Run exact library partition
        shell: bash ci/setup-fsverity-tmp.sh -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 ci/test-shards.py run-libraries --shard '${{ matrix.shard }}' \
            --output "${RUNNER_TEMP}/library-test-map.json"

      - name: Archive the complete library mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-test-map-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/library-test-map.json
          if-no-files-found: error

      - name: Remove disk-backed scratch
        if: always() && env.OPC_CI_DISK_TMPDIR != ''
        run: bash ci/disk-scratch.sh cleanup

  rust-persist:
    name: Rust opc-persist contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare disk-backed scratch
        run: bash ci/disk-scratch.sh prepare

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-rust-persist

      # Compile this package in isolation before workspace all-feature
      # unification can mask an accidental dependency on test-only hooks.
      - name: Check opc-persist default test contract
        run: |
          cargo clippy --locked -p opc-persist --all-targets --no-default-features -- -D warnings
          cargo test --locked -p opc-persist --no-run
          cargo test --locked -p opc-persist \
            --test break_glass_tests \
            --test security_policy_tests \
            --test security_policy_stress_tests \
            --test security_policy_empirical_tests \
            -- --test-threads=1

      # The opc-persist e2e suites drive real consensus subprocess clusters
      # (3-4 nodes plus TCP proxies per test). Running several clusters
      # concurrently oversubscribes shared runners and destabilizes the
      # port-block allocator, so these suites run single-threaded in CI.
      - name: Run consensus e2e tests (serial)
        run: cargo test --locked -p opc-persist --all-features --quiet -- --test-threads=1

      - name: Remove disk-backed scratch
        if: always() && env.OPC_CI_DISK_TMPDIR != ''
        run: bash ci/disk-scratch.sh cleanup

  rust-gtpu-cfg:
    name: Rust GTP-U unsupported-platform cfg
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare disk-backed scratch
        run: bash ci/disk-scratch.sh prepare

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      # A cfg in RUSTFLAGS refingerprints the whole subtree, so this lane
      # never shares a target directory with the ordinary test shards.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-rust-gtpu-cfg

      # Keep the functional composed request in this cfg/feature selection.
      # The separate CNF performance workflow qualifies its one-second limit.
      # Run the durable fixture after unrelated test runtimes have exited.
      - name: Run GTP-U unsupported-platform cfg tests
        env:
          RUSTFLAGS: "--cfg opc_linux_gtpu_sys_force_unsupported"
        run: |
          set -euo pipefail
          selector=ebpf::tests::remote_selector_regression::singleton_public_protected_flow_preserves_durable_state
          cargo test --locked -p opc-linux-gtpu-sys -p opc-gtpu-dataplane --no-default-features --quiet --lib -- --list --exact "$selector" > unsupported-selector-tests.txt
          python3 - "$selector" <<'PYCODE'
          import pathlib
          import sys

          selected = [
              line.removesuffix(": test")
              for line in pathlib.Path("unsupported-selector-tests.txt").read_text().splitlines()
              if line.endswith(": test")
          ]
          if selected != [sys.argv[1]]:
              sys.exit(f"unsupported selector must resolve exactly once: {selected!r}")
          PYCODE
          cargo test --locked -p opc-linux-gtpu-sys -p opc-gtpu-dataplane --no-default-features --quiet -- --exact --skip "$selector"
          # Preserve the request/test contract and retain whole-command host
          # pressure for deadline failures. These are diagnostic counters only.
          selector_resources() {
            date -u +selector_resources_utc=%Y-%m-%dT%H:%M:%S.%NZ || printf 'selector_clock unavailable=true\n'
            for resource in cpu io memory; do
              printf 'selector_pressure_%s\n' "$resource"
              if ! cat "/proc/pressure/$resource" 2>/dev/null; then
                printf 'unavailable\n'
              fi
            done
            sed -n '1p' /proc/stat 2>/dev/null || printf 'selector_cpu unavailable=true\n'
          }
          selector_resources || :
          selector_exit=0
          /usr/bin/time -v cargo test --locked -p opc-linux-gtpu-sys -p opc-gtpu-dataplane --no-default-features --quiet --lib -- --test-threads=1 --exact "$selector" --nocapture || selector_exit=$?
          selector_resources || :
          exit "$selector_exit"

      - name: Remove disk-backed scratch
        if: always() && env.OPC_CI_DISK_TMPDIR != ''
        run: bash ci/disk-scratch.sh cleanup

  # This required Rust-workspace lane executes the ignored fixture in a fresh,
  # root-created private network namespace. It proves cold SCTP connectx over
  # one static multihomed peer; unavailable kernel SCTP support fails rather
  # than skips or weakens the regression proof.
  rust-sctp-privileged:
    name: Rust SCTP cold multihoming
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sctp-privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-sctp-privileged

      - name: Require kernel SCTP support and isolated network namespaces
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables kmod nftables
          if ! sudo modprobe sctp; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sctp
          fi
          grep -qw SCTP /proc/net/protocols
          sudo unshare -n -- bash -euxo pipefail -c '
            ip link set lo up
            ss -H -n -a -A sctp
          '

      - name: Require pending SCTP connection progress through blackholes
        run: |
          set -euo pipefail
          cargo test --locked -p opc-sctp --lib --no-run --message-format=json \
            > "${RUNNER_TEMP}/sctp-progress-build.jsonl"
          progress_binary="$(jq -ers '
            map(select(.reason == "compiler-artifact" and .profile.test == true
              and .target.name == "opc_sctp" and .executable != null))
            | if length == 1 then .[0].executable else error("expected one SCTP test binary") end
          ' "${RUNNER_TEMP}/sctp-progress-build.jsonl")"
          progress_log="${RUNNER_TEMP}/sctp-progress.log"
          sudo unshare -n -- bash -euxo pipefail -c '
            ip link set lo up
            exec "$@"
          ' sctp-progress "${progress_binary}" --ignored --exact \
            tests::connect_progress_survives_pending_blackhole_timeout \
            tests::diameter_full_policy_progress_survives_multihomed_blackhole_timeout \
            --nocapture --test-threads=1 2>&1 | tee "${progress_log}"
          grep -Fq 'test result: ok. 2 passed; 0 failed; 0 ignored;' "${progress_log}"

      - name: Build cold SCTP multihoming regression fixture
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror \
            crates/opc-sctp/tests/n2_lifecycle_uapi.c -o "${RUNNER_TEMP}/n2-lifecycle-uapi"
          "${RUNNER_TEMP}/n2-lifecycle-uapi"
          cargo test --locked -p opc-sctp --test cold_multihoming_netns --no-run

      - name: Require native unprotected N2 framing proof
        run: |
          set -euo pipefail
          n2_proof_log="${RUNNER_TEMP}/sctp-n2-framing.log"
          cargo test --locked -p opc-sctp --lib -- \
            --ignored --exact n2::tests::native::unprotected_n2_profile \
            --nocapture --test-threads=1 2>&1 | tee "${n2_proof_log}"
          grep -Fq 'native N2 framing assertions completed' "${n2_proof_log}"
          grep -Fq 'test result: ok. 1 passed; 0 failed;' "${n2_proof_log}"

      - name: Require native N2 generation lifecycle proof
        run: |
          set -euo pipefail
          n2_owner_log="${RUNNER_TEMP}/sctp-n2-owner.log"
          cargo test --locked -p opc-sctp --lib -- \
            --ignored --exact n2::owner::native_tests::native_generation_replacement_reconnect_and_shutdown \
            --nocapture --test-threads=1 2>&1 | tee "${n2_owner_log}"
          grep -Fq 'native N2 generation lifecycle assertions completed' "${n2_owner_log}"
          grep -Fq 'test result: ok. 1 passed; 0 failed;' "${n2_owner_log}"

      - name: Require composed N2 primary-path failover proof
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          n2_path_log="${RUNNER_TEMP}/sctp-n2-paths.log"
          sudo env \
            "PATH=${PATH}" \
            "CARGO_HOME=${CARGO_HOME}" \
            "RUSTUP_HOME=${RUSTUP_HOME}" \
            "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}" \
            "OPC_SCTP_RUN_PRIVILEGED=1" \
            unshare -n -- bash -euxo pipefail -c '
              cargo test --locked -p opc-sctp --test cold_multihoming_netns -- \
                --ignored --exact n2_generation_survives_primary_path_loss_with_exact_readback \
                --nocapture --test-threads=1
            ' 2>&1 | tee "${n2_path_log}"
          grep -Fq 'native N2 multihoming generation and path assertions completed' "${n2_path_log}"
          grep -Fq 'test result: ok. 1 passed; 0 failed;' "${n2_path_log}"

      - name: Require cold primary-down secondary-up SCTP connectx proof
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          proof_log="${RUNNER_TEMP}/sctp-cold-multihoming.log"
          sudo env \
            "PATH=${PATH}" \
            "CARGO_HOME=${CARGO_HOME}" \
            "RUSTUP_HOME=${RUSTUP_HOME}" \
            "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}" \
            "OPC_SCTP_RUN_PRIVILEGED=1" \
            unshare -n -- bash -euxo pipefail -c '
              ip link set lo up
              cargo test --locked -p opc-sctp --test cold_multihoming_netns -- \
                --ignored --exact cold_primary_down_secondary_up_establishes_within_five_seconds \
                --nocapture --test-threads=1
            ' 2>&1 | tee "${proof_log}"
          grep -Fq 'cold SCTP multihoming connector=connected' "${proof_log}"
          grep -Fq 'test result: ok. 1 passed; 0 failed;' "${proof_log}"

      - name: Require protected SCTP authentication, streams and path failure proof
        run: |
          set -euo pipefail
          cargo test --locked -p opc-diameter-transport --all-features --lib \
            --no-run --message-format=json > "${RUNNER_TEMP}/rfc6083-build.jsonl"
          rfc6083_binary="$(python3 - "${RUNNER_TEMP}/rfc6083-build.jsonl" <<'PY'
          import json, sys
          records = [json.loads(line) for line in open(sys.argv[1])]
          binaries = [r['executable'] for r in records
                      if r.get('reason') == 'compiler-artifact'
                      and r.get('executable')
                      and r['target']['name'] == 'opc_diameter_transport']
          assert len(binaries) == 1, 'expected exactly one transport test binary'
          print(binaries[0])
          PY
          )"
          sudo unshare -n -- bash ci/qualify-rfc6083-native.sh \
            "$rfc6083_binary" "${RUNNER_TEMP}/rfc6083-native"

      - name: Upload protected SCTP qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rfc6083-native
          path: ${{ runner.temp }}/rfc6083-native
          if-no-files-found: warn

      - name: Require private namespace cleanup
        if: always()
        run: |
          set -euo pipefail
          if sudo ip netns list | grep -q '^opc-sctp-cold-'; then
            echo '::error::cold SCTP multihoming test left a network namespace behind'
            sudo ip netns list
            exit 1
          fi

  rust-local-kernel-lifecycle:
    name: Privileged local kernel lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/local-kernel-lifecycle
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare disk-backed scratch
        run: bash ci/disk-scratch.sh prepare

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache local kernel lifecycle build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-local-kernel-lifecycle
          workspaces: . -> target/local-kernel-lifecycle

      - name: Install kernel tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ethtool iproute2 kmod libseccomp2 nftables wireguard-tools

      - name: Regress cleanup namespace ownership
        run: |
          sudo -n python3 ci/test-local-kernel-lifecycle-cleanup-integration.py \
            --evidence-dir "${RUNNER_TEMP}/local-kernel-lifecycle-cleanup-regressions"

      - name: Regress cleanup owner supervision
        run: |
          python3 ci/test-local-kernel-lifecycle-supervision.py \
            --evidence-dir "${RUNNER_TEMP}/local-kernel-lifecycle-supervision-regressions"

      - name: Regress fs-verity runtime interruption and stale cleanup
        run: |
          python3 ci/test-fsverity-runtime.py -v
          python3 ci/test-disk-scratch.py -v

      - name: Check local kernel lifecycle support
        run: |
          set -euo pipefail
          uname -r
          uname -v
          if ! sudo modprobe gtp; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe gtp
          fi
          lsmod | grep '^gtp'
          sudo modprobe wireguard
          # Loading GRE creates fallback interfaces in the host namespace.
          # Include module setup in the baseline, before any private probes.
          sudo modprobe ip_gre
          mkdir -p "${RUNNER_TEMP}/local-kernel-lifecycle-cleanup"
          sudo -n python3 ci/check-local-kernel-lifecycle-cleanup.py snapshot \
            "${RUNNER_TEMP}/local-kernel-lifecycle-cleanup"
          if ! python3 ci/check-local-kernel-lifecycle-cleanup.py run \
            "${RUNNER_TEMP}/local-kernel-lifecycle-cleanup" -- \
            sudo unshare -n -- ip link add vrf-probe type vrf table 10; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe vrf
            python3 ci/check-local-kernel-lifecycle-cleanup.py run \
              "${RUNNER_TEMP}/local-kernel-lifecycle-cleanup" -- \
              sudo unshare -n -- ip link add vrf-probe type vrf table 10
          fi
          # Probe in private namespaces, including the bpffs mount. The
          # qualification creates the same isolation for every exact case.
          python3 ci/check-local-kernel-lifecycle-cleanup.py run \
            "${RUNNER_TEMP}/local-kernel-lifecycle-cleanup" -- \
            sudo unshare -n -m --propagation private -- sh -euc '
            mount -t bpf -o mode=0700 bpf /sys/fs/bpf
            ip link set lo up
            ip link add bridge-probe type bridge
            ip link add lower-probe type dummy
            ip link add link lower-probe name macvlan-probe type macvlan mode passthru
            ip link del macvlan-probe
            ip link add link lower-probe name ipvlan-probe type ipvlan mode l2
            ip link add link lower-probe name vlan-probe type vlan id 100
            ip link add gre-probe type gre local 192.0.2.1 remote 192.0.2.2 dev lower-probe
            tc qdisc add dev lower-probe clsact
            tc filter add dev lower-probe ingress pref 1 matchall action drop
            ip xfrm state list
            ip xfrm policy list
          '
          python3 -c 'import ctypes; ctypes.CDLL("libseccomp.so.2")'

      - name: Qualify exact local kernel lifecycle
        run: |
          python3 ci/check-local-kernel-lifecycle-cleanup.py run \
            "${RUNNER_TEMP}/local-kernel-lifecycle-cleanup" -- \
            python3 ci/qualify-local-kernel-lifecycle.py \
            --evidence-dir "${RUNNER_TEMP}/local-kernel-lifecycle"

      - name: Require local kernel lifecycle cleanup
        if: always()
        run: |
          sudo -n python3 ci/check-local-kernel-lifecycle-cleanup.py verify \
            "${RUNNER_TEMP}/local-kernel-lifecycle-cleanup"

      - name: Upload local kernel lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-kernel-lifecycle
          overwrite: true
          path: |
            ${{ runner.temp }}/local-kernel-lifecycle
            ${{ runner.temp }}/local-kernel-lifecycle-cleanup
            ${{ runner.temp }}/local-kernel-lifecycle-cleanup-regressions
            ${{ runner.temp }}/local-kernel-lifecycle-supervision-regressions
          if-no-files-found: error

      - name: Remove disk-backed scratch
        if: always() && env.OPC_CI_DISK_TMPDIR != ''
        run: bash ci/disk-scratch.sh cleanup --privileged

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - test-inventory
      - rust-gates
      - rust-clippy
      - rust-tests
      - rust-native-log-proofs
      - rust-libraries
      - rust-persist
      - rust-gtpu-cfg
      - rust-sctp-privileged
      - rust-local-kernel-lifecycle
      - session-net-i686
    steps:
      # Preserves the single check name the previous monolithic job reported,
      # so anything watching "Rust workspace" keeps meaning the whole suite.
      # A skipped or cancelled lane fails here too: only an all-success run
      # may report success.
      - name: Require every Rust lane to succeed
        # Passed through the environment rather than interpolated into the
        # script, so lane names can never be treated as shell.
        env:
          LANE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          lanes = json.loads(os.environ["LANE_RESULTS"])
          for name, lane in sorted(lanes.items()):
              print(f"{name}: {lane['result']}")
          failed = sorted(n for n, l in lanes.items() if l["result"] != "success")
          if failed:
              print(f"::error::Rust lanes did not succeed: {', '.join(failed)}")
              sys.exit(1)
          print(f"all {len(lanes)} Rust lanes succeeded")
          PY

  vendored-dtls:
    name: Audited vendored DTLS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/vendored-dtls
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install source-invariant scanner
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: opc-vendored-dtls

      - name: Check external consumer resolution
        run: python3 scripts/check-vendored-dimpl.py

      - name: Check audited DTLS fork formatting
        run: cargo fmt --manifest-path vendor/dimpl/Cargo.toml --all --check

      - name: Check independent RFC 5746 and RFC 6066 fixtures
        run: |
          python3 -m venv "${RUNNER_TEMP}/dtls-reference"
          "${RUNNER_TEMP}/dtls-reference/bin/pip" install --quiet \
            -r crates/opc-diameter-transport/tests/fixtures/rfc6083/requirements.txt
          "${RUNNER_TEMP}/dtls-reference/bin/python" vendor/dimpl/tests/dtls12/rfc5746_binding_reference.py --check
          "${RUNNER_TEMP}/dtls-reference/bin/python" vendor/dimpl/tests/dtls12/rfc5746_hello_reference.py --check
          "${RUNNER_TEMP}/dtls-reference/bin/python" vendor/dimpl/tests/dtls12/rfc6066_reference.py --check
          "${RUNNER_TEMP}/dtls-reference/bin/python" crates/opc-diameter-transport/tests/fixtures/rfc6083/nds_certificates.py
          "${RUNNER_TEMP}/dtls-reference/bin/python" crates/opc-diameter-transport/tests/fixtures/rfc6083/revocation.py

      - name: Lint every all-feature DTLS target
        run: cargo clippy --manifest-path vendor/dimpl/Cargo.toml --all-features --all-targets -- -D warnings

      - name: Lint every RustCrypto-only DTLS target
        run: cargo clippy --manifest-path vendor/dimpl/Cargo.toml --no-default-features --features rust-crypto --all-targets -- -D warnings

      - name: Deny production panic paths with all features
        run: cargo clippy --manifest-path vendor/dimpl/Cargo.toml --all-features --lib -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Deny production panic paths with RustCrypto
        run: cargo clippy --manifest-path vendor/dimpl/Cargo.toml --no-default-features --features rust-crypto --lib -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Test every all-feature DTLS target
        run: cargo test --manifest-path vendor/dimpl/Cargo.toml --all-features --all-targets

      - name: Test all-feature DTLS documentation
        run: cargo test --manifest-path vendor/dimpl/Cargo.toml --all-features --doc

      - name: Test every RustCrypto-only DTLS target
        run: cargo test --manifest-path vendor/dimpl/Cargo.toml --no-default-features --features rust-crypto --all-targets

      - name: Test RustCrypto-only DTLS documentation
        run: cargo test --manifest-path vendor/dimpl/Cargo.toml --no-default-features --features rust-crypto --doc

      - name: Test vendored source-invariant guard
        run: python3 ci/test-vendored-dtls-source.py

      # Report every violation and fail closed if the scanner cannot run.
      - name: Enforce vendored RFC 6083 source invariants
        run: bash ci/check-vendored-dtls-source.sh

  session-net-i686-tests:
    name: opc-session-net i686 (${{ matrix.slice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: ordinary
            cache_key: opc-session-net-i686
          - slice: ordinary-authority
            cache_key: opc-session-net-i686-authority
          - slice: ordinary-integration
            cache_key: opc-session-net-i686-integration
          - slice: contracts
            cache_key: opc-session-net-i686-contracts
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: gcc
      RUSTFLAGS: "-C link-arg=-m32"
      TARGET_CC: gcc
      TARGET_CFLAGS: "-m32"
      I686_SLICE: ${{ matrix.slice }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare disk-backed scratch
        run: bash ci/disk-scratch.sh prepare

      - name: Install 32-bit system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-multilib

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      # The protected-roster snapshot/restart contracts seal their snapshot
      # artifacts on the dedicated fs-verity filesystem. Build output,
      # TMPDIR, databases, WALs, sockets, and general process scratch remain
      # on ordinary storage.
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache_key }}

      - name: Verify future i686 test target coverage
        if: matrix.slice == 'ordinary-integration'
        run: python3 ci/test-i686-target-selection.py

      - name: Run opc-session-net tests on i686
        shell: bash ci/setup-fsverity-tmp.sh -- bash --noprofile --norc -e -o pipefail {0}
        # The stateless three-voter consumer proofs retain literal authority
        # and snapshot budgets. Run every functional test exactly once,
        # but give each wall-time contract a fresh 32-bit process so completed
        # fixture runtimes cannot consume a later contract's budget.
        run: |
          set -euo pipefail
          ordinary_timing_contracts=(
            persistent_three_voter_consumer_write_does_not_spend_budget_on_a_read_quorum
            persistent_three_voter_first_transition_has_one_leader_activation_proof
          )
          # Keep the original bounds and debug/overflow assertions. Optimize
          # the protected request and snapshot fixtures, matching the core lane.
          optimized_timing_contracts=(
            protected_consumer_chain_after_activation_elides_outer_capability_wire_calls
            persistent_three_voter_fenced_status_converges_after_response_loss_and_compaction
            persistent_three_voter_protected_roster_creates_absent_record_then_established_terminal
            persistent_three_voter_protected_roster_aborted_exact_bytes_survive_snapshot_and_full_restart
            persistent_three_voter_protected_roster_commits_maximum_plan_and_result_then_established_terminal
            persistent_three_voter_protected_roster_survives_real_os_process_loss
            persistent_three_voter_snapshot_maintenance_with_concurrent_read_barriers_keeps_engines_running
            persistent_three_voter_protected_roster_exact_bytes_survive_snapshot_and_full_restart
          )
          timing_contracts=("${ordinary_timing_contracts[@]}" "${optimized_timing_contracts[@]}")
          case "${I686_SLICE}" in
            ordinary|ordinary-authority)
              # Resolve the entire library before selecting either complement.
              # The publication-authority module and durable crash matrix are
              # independent of the other tests and retain their ordinary profile.
              inventory=$(cargo test --locked \
                -p opc-session-net \
                --all-features \
                --target i686-unknown-linux-gnu \
                --quiet \
                --lib \
                -- --list --format=terse)
              library_tests=()
              authority_tests=()
              declare -A library_names=() authority_names=() timing_names=()
              while IFS= read -r line; do
                if [[ "$line" == *": test" ]]; then
                  test_name=${line%": test"}
                  if [[ -z "$test_name" ]]; then
                    echo "Empty i686 library test name" >&2
                    exit 1
                  fi
                  if [[ -n "${library_names[$test_name]+present}" ]]; then
                    echo "Duplicate i686 library test: $test_name" >&2
                    exit 1
                  fi
                  library_tests+=("$test_name")
                  library_names["$test_name"]=1
                  case "$test_name" in
                    stateless_quorum_consumer::publication_authority_failover::*|stateless_quorum_consumer::persistent_three_voter_protected_roster_durable_crash_cut_matrix)
                      authority_tests+=("$test_name")
                      authority_names["$test_name"]=1
                      ;;
                  esac
                elif [[ -n "$line" && ! "$line" =~ ^[0-9]+\ tests?,\ [0-9]+\ benchmarks?$ ]]; then
                  echo "Unexpected i686 library inventory line: $line" >&2
                  exit 1
                fi
              done <<< "$inventory"
              crash_matrix=stateless_quorum_consumer::persistent_three_voter_protected_roster_durable_crash_cut_matrix
              if [[ -z "${library_names[$crash_matrix]+present}" ]] || (( ${#authority_tests[@]} < 2 )); then
                echo "The i686 authority shard must resolve its module and durable crash matrix" >&2
                exit 1
              fi
              skips=()
              for timing_contract in "${timing_contracts[@]}"; do
                test_name="stateless_quorum_consumer::$timing_contract"
                if [[ -z "${library_names[$test_name]+present}" || -n "${authority_names[$test_name]+present}" || -n "${timing_names[$test_name]+present}" ]]; then
                  echo "Missing, duplicate or overlapping i686 timing contract: $test_name" >&2
                  exit 1
                fi
                timing_names["$test_name"]=1
                skips+=(--skip "$test_name")
              done
              for test_name in "${library_tests[@]}"; do
                if [[ -n "${timing_names[$test_name]+present}" ]]; then
                  continue
                fi
                if [[ "$I686_SLICE" == ordinary && -n "${authority_names[$test_name]+present}" || "$I686_SLICE" == ordinary-authority && -z "${authority_names[$test_name]+present}" ]]; then
                  skips+=(--skip "$test_name")
                fi
              done
              printf 'i686 library partition: %s total, %s authority, %s contracts; slice=%s\n' \
                "${#library_tests[@]}" "${#authority_tests[@]}" "${#timing_contracts[@]}" "$I686_SLICE"
              cargo test --locked \
                -p opc-session-net \
                --all-features \
                --target i686-unknown-linux-gnu \
                --quiet \
                --lib \
                -- \
                --test-threads=1 \
                --exact \
                "${skips[@]}"
              ;;
            ordinary-integration)
              # Include executable unit tests and every registered integration
              # binary, including future additions. Selection omits doctests,
              # so retain them explicitly in the same shard.
              cargo test --locked \
                -p opc-session-net \
                --all-features \
                --target i686-unknown-linux-gnu \
                --quiet \
                --bins \
                --test '*' \
                -- \
                --test-threads=1
              cargo test --locked \
                -p opc-session-net \
                --all-features \
                --target i686-unknown-linux-gnu \
                --quiet \
                --doc \
                -- \
                --test-threads=1
              ;;
            contracts)
              for timing_contract in "${ordinary_timing_contracts[@]}"; do
                cargo test --locked \
                  -p opc-session-net \
                  --all-features \
                  --target i686-unknown-linux-gnu \
                  --quiet \
                  --lib \
                  -- \
                  --test-threads=1 \
                  --exact \
                  "stateless_quorum_consumer::$timing_contract"
              done
              for timing_contract in "${optimized_timing_contracts[@]}"; do
                env CARGO_PROFILE_TEST_OPT_LEVEL=1 cargo test --locked \
                  -p opc-session-net \
                  --all-features \
                  --target i686-unknown-linux-gnu \
                  --quiet \
                  --lib \
                  -- \
                  --test-threads=1 \
                  --exact \
                  "stateless_quorum_consumer::$timing_contract"
              done
              ;;
            *)
              echo "Unknown i686 test slice: ${I686_SLICE}" >&2
              exit 1
              ;;
          esac

      # Widened beyond opc-session-net: opc-protocol is the shared error type
      # whose layout every protocol crate depends on, and opc-proto-gtpv2c
      # carries the caller-supplied absolute usize base offsets whose checked
      # arithmetic is width-sensitive. The SQLite file-control regression
      # also requires i686 to expose a narrow stat ABI on large sparse files.
      - name: Run 32-bit portability tests
        if: matrix.slice == 'ordinary-integration'
        run: |
          cargo test --locked -p opc-protocol -p opc-proto-gtpv2c --all-features --target i686-unknown-linux-gnu --quiet -- --test-threads=4
          cargo test --locked -p opc-sqlite-file-control-sys --all-features --target i686-unknown-linux-gnu --quiet -- --test-threads=4

      - name: Remove disk-backed scratch
        if: always() && env.OPC_CI_DISK_TMPDIR != ''
        run: bash ci/disk-scratch.sh cleanup

  # Keep the existing required-check job key and display name stable while
  # requiring both library shards, integrations and contracts to succeed.
  session-net-i686:
    name: opc-session-net i686
    if: always()
    needs: [session-net-i686-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      I686_TESTS_RESULT: ${{ needs.session-net-i686-tests.result }}
    steps:
      - name: Require every i686 test slice to succeed
        run: |
          if [ "${I686_TESTS_RESULT}" != success ]; then
            echo "i686 test slices finished with ${I686_TESTS_RESULT}" >&2
            exit 1
          fi

  feature-powerset:
    name: opc-sdk feature powerset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-hack@0.6.45
          fallback: none

      - name: Check opc-sdk feature powerset
        run: cargo hack check -p opc-sdk --feature-powerset --depth 2 --locked

  generated-drift:
    name: Generated code drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML==6.0.2
          cargo install rasn-compiler --version 0.16.0 --features cli --locked

      - name: Regenerate API and NGAP bindings
        run: make generate-api generate-ngap

      - name: Check generated code drift
        run: git diff --exit-code -- crates/opc-proto-ngap/src/generated.rs crates/opc-api-nnrf/src/types.rs

  smf-reference:
    name: Reference SMF consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/smf-reference
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features --quiet -- --test-threads=4

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (1.89)
        # Keep the supported compiler version independent of action updates.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.89.0"

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features

      - name: Publish-order graph check
        run: python3 scripts/publish-order.py --check

  docs:
    name: Rust documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  go-operator:
    name: Go reference operator
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: operators/sdk-reference-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operators/sdk-reference-operator/go.mod
          cache-dependency-path: operators/sdk-reference-operator/go.sum

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Run Go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run Go tests
        env:
          # The race runtime needs cgo on linux (cmd/go/internal/work/init.go);
          # only this step overrides the job's pure-Go build posture.
          CGO_ENABLED: "1"
        run: go test -race ./...

  go-sdk:
    name: Go operator SDK
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: operators/operator-sdk-go
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operators/operator-sdk-go/go.mod
          cache-dependency-path: operators/operator-sdk-go/go.sum

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Run Go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run Go tests
        env:
          # The race runtime needs cgo on linux (cmd/go/internal/work/init.go);
          # only this step overrides the job's pure-Go build posture.
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Check downstream import contract
        run: ./scripts/check-downstream-import.sh

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Render Kustomize manifests
        run: kubectl kustomize operators/sdk-reference-operator/config/default

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint operators/helm/sdk-reference-operator/

      # kubectl client-side dry runs cannot resolve CRD kinds (cert-manager
      # Issuer/Certificate) without a cluster, so rendered output is checked
      # as strict YAML instead.
      - name: Helm template (cert-manager)
        run: |
          helm template sdk-ref operators/helm/sdk-reference-operator/ > /tmp/rendered-certmanager.yaml
          python3 -c 'import yaml; list(yaml.safe_load_all(open("/tmp/rendered-certmanager.yaml")))'

      - name: Helm template (manual cert)
        run: |
          helm template sdk-ref operators/helm/sdk-reference-operator/ --set webhook.certMode=manual --set webhook.secretName=my-secret > /tmp/rendered-manual.yaml
          python3 -c 'import yaml; list(yaml.safe_load_all(open("/tmp/rendered-manual.yaml")))' 
