name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-856-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic-856:
    name: Bounded 856 failure capture (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: current-1
            source: 75044f43852cd816d9734d03914515395bf20c69
          - profile: current-2
            source: 75044f43852cd816d9734d03914515395bf20c69
          - profile: current-3
            source: 75044f43852cd816d9734d03914515395bf20c69
          - profile: current-4
            source: 75044f43852cd816d9734d03914515395bf20c69
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_BACKTRACE: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SOURCE_COMMIT: ${{ matrix.source }}
      SOURCE_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout diagnostic harness only
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare exact unmodified SDK source
        run: |
          source_worktree="$RUNNER_TEMP/sdk856-$SOURCE_PROFILE"
          git worktree add --detach "$source_worktree" "$SOURCE_COMMIT"
          printf 'SOURCE_WORKTREE=%s\n' "$source_worktree" >> "$GITHUB_ENV"
      - name: Install original qualified Rust version
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Prepare standard snapshot storage
        run: '"$SOURCE_WORKTREE/ci/setup-fsverity-tmp.sh"'
      - name: Run unchanged source with external observation
        run: python3 ci/diagnose-856-external.py --source "$SOURCE_WORKTREE" --output "diagnostic-856-$SOURCE_PROFILE" --samples 8
      - name: Preserve exact source, observations and first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-856-${{ matrix.profile }}
          path: diagnostic-856-${{ matrix.profile }}/
          if-no-files-found: error
