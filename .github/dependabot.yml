version: 2
updates:
  - package-ecosystem: cargo
    # The example uses path dependencies from the root workspace. Keep both
    # lockfiles in the same update so inherited manifest changes stay buildable.
    directories:
      - /
      - /examples/smf-reference
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    # The reference operator replaces the SDK module with the local directory.
    directories:
      - /operators/operator-sdk-go
      - /operators/sdk-reference-operator
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
